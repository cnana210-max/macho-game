<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>マッチョ育成ゲーム</title>
<style>
  :root {
    color-scheme: light;
    --bg-top: #fff2e0;
    --bg-bottom: #ffd9a8;
    --skin: #e8b98a;
    --skin-shade: #d1985f;
    --accent: #ff6b35;
    --accent-dark: #e0501d;
    --ink: #3a2a1a;
    --panel: #ffffff;
    --red: #e23b2e;
    --gold: #f5c518;
    --blue: #2b5fa8;
    --white: #ffffff;
    --outline: #3a2419;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: var(--ink);
  }
  body {
    display: flex;
    justify-content: center;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    min-height: 100vh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .app {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 16px 16px 24px;
  }
  h1 {
    text-align: center;
    font-size: clamp(20px, 5vw, 28px);
    margin: 4px 0 12px;
    letter-spacing: 0.05em;
  }
  .top-stats {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }
  .stat-box {
    flex: 1;
    background: var(--panel);
    border-radius: 14px;
    padding: 10px 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .stat-label {
    font-size: 12px;
    opacity: 0.65;
    font-weight: bold;
  }
  .stat-value {
    font-size: clamp(18px, 5.5vw, 24px);
    font-weight: bold;
    color: var(--accent-dark);
    line-height: 1.3;
  }
  .progress-track {
    height: 8px;
    background: #f0e2d0;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 6px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
  }
  .progress-max {
    margin-top: 6px;
    font-size: 13px;
    font-weight: bold;
    color: var(--accent-dark);
  }
  .stat-sub {
    margin-top: 4px;
    font-size: 11px;
    font-weight: bold;
    color: var(--accent-dark);
    opacity: 0.75;
  }
  .stage {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 300px;
    padding: 12px 0;
  }
  .character-img {
    display: block;
    width: auto;
    height: 100%;
    max-height: 300px;
    max-width: 100%;
    object-fit: contain;
    transition: opacity 0.3s ease;
  }
  .character-img.punch {
    animation: punchScale 0.4s ease-out;
  }
  @keyframes punchScale {
    0% { transform: scale(1); }
    45% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .levelup-glow {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
  }
  .levelup-glow.show {
    animation: glowPulse 1.1s ease-out forwards;
  }
  .levelup-glow::before {
    content: '';
    width: 70%;
    aspect-ratio: 1;
    max-width: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245,197,24,0.9) 0%, rgba(245,197,24,0.4) 45%, rgba(245,197,24,0) 72%);
  }
  @keyframes glowPulse {
    0% { opacity: 0; transform: scale(0.6); }
    30% { opacity: 1; transform: scale(1.1); }
    100% { opacity: 0; transform: scale(1.35); }
  }
  .levelup-particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .levelup-particle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0;
    transform: translate(-50%, -50%);
  }
  .levelup-particle.star {
    width: auto;
    height: auto;
    background: none;
    color: var(--gold);
    font-size: 15px;
    line-height: 1;
  }
  .levelup-particle.show {
    animation: particleBurst 0.9s ease-out forwards;
  }
  @keyframes particleBurst {
    0% { opacity: 1; transform: translate(-50%, -50%) translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) scale(0.4); }
  }
  .screen-flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 9998;
  }
  .screen-flash.show {
    animation: flashFade 0.4s ease-out forwards;
  }
  @keyframes flashFade {
    0% { opacity: 0; }
    15% { opacity: 0.4; }
    100% { opacity: 0; }
  }
  .levelup-text-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 9999;
    opacity: 0;
    text-align: center;
    padding: 0 16px;
  }
  .levelup-text-overlay.show {
    animation: levelupOverlayFade 1.5s ease-out forwards;
  }
  @keyframes levelupOverlayFade {
    0% { opacity: 0; }
    12% { opacity: 1; }
    75% { opacity: 1; }
    100% { opacity: 0; }
  }
  .levelup-main-text {
    font-size: clamp(30px, 9vw, 48px);
    font-weight: 900;
    color: var(--red);
    -webkit-text-stroke: 1.5px #fff;
    paint-order: stroke fill;
    text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff, 0 0 10px rgba(0,0,0,0.15);
    letter-spacing: 0.03em;
    transform: scale(0.2);
  }
  .levelup-text-overlay.show .levelup-main-text {
    animation: levelupPop 1.5s cubic-bezier(.25,1.6,.4,1) forwards;
  }
  @keyframes levelupPop {
    0% { transform: scale(0.2); }
    18% { transform: scale(1.15); }
    30% { transform: scale(1); }
    100% { transform: scale(1); }
  }
  .levelup-sub-text {
    margin-top: 10px;
    font-size: clamp(15px, 4.2vw, 19px);
    font-weight: bold;
    color: var(--ink);
    background: rgba(255,255,255,0.88);
    padding: 5px 16px;
    border-radius: 999px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .info {
    background: var(--panel);
    border-radius: 16px;
    padding: 14px 16px;
    margin: 0 0 14px;
    min-height: 64px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .info .name {
    font-size: clamp(17px, 4.5vw, 20px);
    font-weight: bold;
    color: var(--accent-dark);
  }
  .info .desc {
    font-size: clamp(14px, 3.8vw, 16px);
    line-height: 1.4;
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px 10px;
  }
  .part-status {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 6px;
    border-radius: 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    font-family: inherit;
    cursor: pointer;
    touch-action: manipulation;
  }
  .part-status:active {
    filter: brightness(0.9);
  }
  .btn-label {
    font-size: clamp(18px, 5vw, 22px);
    font-weight: bold;
  }
  .btn-count {
    font-size: clamp(13px, 3.5vw, 15px);
    opacity: 0.9;
  }
  .quiz-open-btn {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    margin-top: 18px;
    padding: 14px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--blue), #1d3f73);
    color: #fff;
    font-family: inherit;
    font-weight: bold;
    font-size: clamp(15px, 4.5vw, 18px);
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  }
  .quiz-open-btn:active {
    filter: brightness(0.92);
  }
  .quiz-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 12, 5, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9985;
    padding: 20px;
  }
  .quiz-overlay[hidden] {
    display: none;
  }
  .quiz-card {
    background: var(--panel);
    border-radius: 20px;
    padding: 24px 20px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  .quiz-progress {
    font-size: 13px;
    font-weight: bold;
    opacity: 0.65;
    text-align: center;
    margin-bottom: 10px;
  }
  .quiz-question {
    font-size: clamp(16px, 4.6vw, 19px);
    font-weight: bold;
    text-align: center;
    margin-bottom: 18px;
    line-height: 1.5;
  }
  .quiz-choices {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .quiz-choice-btn {
    -webkit-appearance: none;
    appearance: none;
    border: 2px solid transparent;
    border-radius: 14px;
    padding: 14px 8px;
    background: var(--bg-top);
    color: var(--ink);
    font-family: inherit;
    font-weight: bold;
    font-size: clamp(13px, 3.8vw, 15px);
    cursor: pointer;
    touch-action: manipulation;
  }
  .quiz-choice-btn:disabled {
    cursor: default;
  }
  .quiz-choice-btn.correct {
    border-color: #3ea35a;
    background: #e4f6e9;
    color: #1f7a3d;
  }
  .quiz-choice-btn.wrong {
    border-color: var(--red);
    background: #fbe4e2;
    color: var(--red);
  }
  .quiz-feedback-text {
    text-align: center;
    margin-top: 14px;
    font-weight: bold;
    font-size: clamp(14px, 4vw, 16px);
  }
  .quiz-feedback-text.correct {
    color: #1f7a3d;
  }
  .quiz-feedback-text.wrong {
    color: var(--red);
  }
  .quiz-result-title {
    font-size: clamp(24px, 7vw, 30px);
    font-weight: 900;
    text-align: center;
    color: var(--accent-dark);
    margin-bottom: 10px;
  }
  .quiz-result-bonus {
    font-size: clamp(18px, 5.5vw, 22px);
    font-weight: bold;
    text-align: center;
    color: var(--red);
    margin-bottom: 8px;
  }
  .quiz-result-perfect {
    text-align: center;
    font-size: clamp(15px, 4.5vw, 17px);
    font-weight: bold;
    color: #b8860b;
    margin-bottom: 14px;
  }
  .quiz-close-btn {
    display: block;
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    margin-top: 10px;
    padding: 12px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    font-weight: bold;
    font-size: clamp(15px, 4.5vw, 17px);
    cursor: pointer;
    touch-action: manipulation;
  }
  .quiz-close-btn:active {
    filter: brightness(0.9);
  }
  .shop {
    margin-top: 18px;
  }
  .shop-title {
    font-size: clamp(16px, 4.5vw, 19px);
    font-weight: bold;
    margin-bottom: 8px;
    letter-spacing: 0.03em;
  }
  .shop-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .shop-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--panel);
    border-radius: 14px;
    padding: 10px 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .shop-item-info {
    flex: 1;
    min-width: 0;
  }
  .shop-item-name {
    font-size: clamp(14px, 4vw, 16px);
    font-weight: bold;
    color: var(--accent-dark);
  }
  .shop-item-desc {
    font-size: clamp(11px, 3.2vw, 13px);
    opacity: 0.75;
    margin-top: 2px;
  }
  .shop-item-owned {
    font-size: clamp(11px, 3.2vw, 12px);
    opacity: 0.6;
    margin-top: 2px;
  }
  .shop-buy-btn {
    -webkit-appearance: none;
    appearance: none;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    border: none;
    border-radius: 12px;
    padding: 8px 12px;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    cursor: pointer;
    touch-action: manipulation;
    min-width: 84px;
  }
  .shop-buy-btn:active:not(:disabled) {
    filter: brightness(0.9);
  }
  .shop-buy-btn .price-val {
    font-size: clamp(12px, 3.4vw, 14px);
    font-weight: bold;
  }
  .shop-buy-btn .buy-label {
    font-size: 11px;
    opacity: 0.9;
  }
  .shop-buy-btn:disabled {
    background: #d8d0c4;
    color: #9a9086;
    cursor: default;
  }
  .reset-wrap {
    display: flex;
    justify-content: center;
    margin-top: 22px;
  }
  .reset-btn {
    -webkit-appearance: none;
    appearance: none;
    padding: 8px 20px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--skin-shade);
    border-radius: 999px;
    opacity: 0.6;
    touch-action: manipulation;
  }
  .reset-btn:active {
    opacity: 1;
  }
  @media (max-height: 640px) {
    .character-img { max-height: 225px; }
    .stage { min-height: 225px; padding: 6px 0 12px; }
    h1 { margin: 2px 0 8px; }
    .top-stats { margin-bottom: 6px; }
    .stat-box { padding: 8px 12px; }
    .info { padding: 10px 14px; min-height: 52px; margin-bottom: 10px; }
    .quiz-open-btn { margin-top: 12px; padding: 11px; }
    .shop { margin-top: 12px; }
    .shop-item { padding: 8px 12px; }
    .reset-wrap { margin-top: 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>マッチョ育成ゲーム</h1>
  <div class="top-stats">
    <div class="stat-box">
      <div class="stat-label">筋力P</div>
      <div class="stat-value" id="powerPValue">0</div>
      <div class="stat-sub" id="powerPerSecond" hidden>毎秒 +0P</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">称号</div>
      <div class="stat-value" id="titleValue">ひょろがり</div>
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-max" id="progressMax" hidden>MAX</div>
    </div>
  </div>
  <div class="stage">
    <div class="levelup-glow" id="levelupGlow"></div>
    <img class="character-img" id="bodyImage" src="images/lv1.png" alt="キャラクター">
    <div class="levelup-particles" id="levelupParticles"></div>
  </div>
  <div class="info" id="info">
    <div class="name">さあ、鍛えよう！</div>
    <div class="desc">キャラクターの体（胸・腕・脚・肩・背中・腹）をタップして筋トレを始めましょう</div>
  </div>
  <div class="controls">
    <button class="part-status" data-part="chest">
      <span class="btn-label">胸</span>
      <span class="btn-count" id="count-chest">0回</span>
    </button>
    <button class="part-status" data-part="arm">
      <span class="btn-label">腕</span>
      <span class="btn-count" id="count-arm">0回</span>
    </button>
    <button class="part-status" data-part="leg">
      <span class="btn-label">脚</span>
      <span class="btn-count" id="count-leg">0回</span>
    </button>
    <button class="part-status" data-part="shoulder">
      <span class="btn-label">肩</span>
      <span class="btn-count" id="count-shoulder">0回</span>
    </button>
    <button class="part-status" data-part="back">
      <span class="btn-label">背中</span>
      <span class="btn-count" id="count-back">0回</span>
    </button>
    <button class="part-status" data-part="abs">
      <span class="btn-label">腹</span>
      <span class="btn-count" id="count-abs">0回</span>
    </button>
  </div>
  <button class="quiz-open-btn" id="quizOpenBtn">筋肉クイズに挑戦</button>
  <div class="shop">
    <div class="shop-title">ジム</div>
    <div class="shop-list" id="shopList"></div>
  </div>
  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">最初から</button>
  </div>
</div>
<div class="screen-flash" id="screenFlash"></div>
<div class="levelup-text-overlay" id="levelupTextOverlay">
  <div class="levelup-main-text">筋肉増量！</div>
  <div class="levelup-sub-text" id="levelupSub">かけだし に昇格！</div>
</div>
<div class="quiz-overlay" id="quizOverlay" hidden>
  <div class="quiz-card">
    <div id="quizQuestionView">
      <div class="quiz-progress" id="quizProgress">1問目 / 5問</div>
      <div class="quiz-question" id="quizQuestion"></div>
      <div class="quiz-choices" id="quizChoices"></div>
      <div class="quiz-feedback-text" id="quizFeedbackText" hidden></div>
    </div>
    <div id="quizResultView" hidden>
      <div class="quiz-result-title" id="quizResultTitle">3問正解！</div>
      <div class="quiz-result-bonus" id="quizResultBonus">＋150P 獲得</div>
      <div class="quiz-result-perfect" id="quizResultPerfect" hidden>パーフェクト！</div>
      <button class="quiz-close-btn" id="quizCloseBtn">閉じる</button>
    </div>
  </div>
</div>
<script>
  const parts = {
    chest: { name: '大胸筋', desc: '胸の中心を覆う大きな筋肉。押す動作で使われます。', count: 0 },
    arm: { name: '上腕二頭筋', desc: '腕の力こぶ。ものを持ち上げる動作で使われます。', count: 0 },
    leg: { name: '大腿四頭筋', desc: '太ももの前側の筋肉。歩く・走るときに使われます。', count: 0 },
    shoulder: { name: '三角筋', desc: '肩を丸く覆う筋肉。腕を横に上げる動作で使われます。', count: 0 },
    back: { name: '広背筋', desc: '背中を大きく広げる筋肉。逆三角形の体型を作ります。', count: 0 },
    abs: { name: '腹直筋', desc: 'お腹の中心を縦に走る筋肉。腹筋運動で鍛えられます。', count: 0 }
  };

  const infoName = document.querySelector('#info .name');
  const infoDesc = document.querySelector('#info .desc');
  const bodyImg = document.getElementById('bodyImage');
  const powerPValue = document.getElementById('powerPValue');
  const titleValue = document.getElementById('titleValue');
  const progressTrack = document.getElementById('progressTrack');
  const progressFill = document.getElementById('progressFill');
  const progressMax = document.getElementById('progressMax');
  const levelupGlow = document.getElementById('levelupGlow');
  const levelupParticles = document.getElementById('levelupParticles');
  const screenFlash = document.getElementById('screenFlash');
  const levelupTextOverlay = document.getElementById('levelupTextOverlay');
  const levelupSub = document.getElementById('levelupSub');
  const powerPerSecondEl = document.getElementById('powerPerSecond');
  const shopListEl = document.getElementById('shopList');
  const quizOpenBtn = document.getElementById('quizOpenBtn');
  const quizOverlay = document.getElementById('quizOverlay');
  const quizQuestionView = document.getElementById('quizQuestionView');
  const quizResultView = document.getElementById('quizResultView');
  const quizProgress = document.getElementById('quizProgress');
  const quizQuestionEl = document.getElementById('quizQuestion');
  const quizChoicesEl = document.getElementById('quizChoices');
  const quizFeedbackText = document.getElementById('quizFeedbackText');
  const quizResultTitle = document.getElementById('quizResultTitle');
  const quizResultBonus = document.getElementById('quizResultBonus');
  const quizResultPerfect = document.getElementById('quizResultPerfect');
  const quizCloseBtn = document.getElementById('quizCloseBtn');
  let levelupTimer = null;
  const STORAGE_KEY = 'macho-game-progress';
  const STAGE_THRESHOLDS = [0, 10, 25, 45, 70, 100];
  const TITLES = ['ひょろがり', 'かけだし', '見習いルチャドール', '中堅ルチャドール', '覆面マッチョ', '伝説の覆面王'];
  const PART_LABELS = { chest: '胸', arm: '腕', leg: '脚', shoulder: '肩', back: '背中', abs: '腹' };
  const QUIZ_QUESTION_COUNT = 5;
  const QUIZ_CORRECT_BONUS = 50;
  const QUIZ_PERFECT_BONUS = 200;
  const QUIZ_ANSWER_DELAY = 1200;
  let currentStage = -1;
  let quizQuestions = [];
  let quizIndex = 0;
  let quizCorrectCount = 0;
  let quizAnswering = false;
  let quizPendingBonus = 0;
  let quizAdvanceTimer = null;

  const SHOP_ITEMS = [
    { id: 'protein', name: 'プロテイン', desc: '1タップの獲得量 +1', basePrice: 10, type: 'tap', value: 1 },
    { id: 'dumbbell', name: 'ダンベル', desc: '毎秒 +1P', basePrice: 50, type: 'auto', value: 1 },
    { id: 'bench', name: 'ベンチプレス台', desc: '毎秒 +5P', basePrice: 300, type: 'auto', value: 5 },
    { id: 'trainer', name: 'パーソナルトレーナー', desc: '毎秒 +20P', basePrice: 1500, type: 'auto', value: 20 },
    { id: 'suit', name: '加圧スーツ', desc: '1タップの獲得量 +5', basePrice: 5000, type: 'tap', value: 5 },
    { id: 'belt', name: '王者のベルト', desc: '毎秒 +100P', basePrice: 20000, type: 'auto', value: 100 }
  ];
  const shopOwned = { protein: 0, dumbbell: 0, bench: 0, trainer: 0, suit: 0, belt: 0 };
  let powerWallet = 0;
  let powerLifetime = 0;

  function formatNumber(n) {
    n = Math.floor(n);
    if (n >= 1000000) {
      return (n / 10000).toFixed(1) + '万';
    }
    return n.toLocaleString('en-US');
  }

  function priceFor(item) {
    return Math.ceil(item.basePrice * Math.pow(1.15, shopOwned[item.id]));
  }

  function calcTapBonus() {
    return SHOP_ITEMS.filter(i => i.type === 'tap').reduce((sum, i) => sum + i.value * shopOwned[i.id], 0);
  }

  function calcPerSecond() {
    return SHOP_ITEMS.filter(i => i.type === 'auto').reduce((sum, i) => sum + i.value * shopOwned[i.id], 0);
  }

  function stageForTotal(total) {
    let stage = 0;
    STAGE_THRESHOLDS.forEach((min, idx) => { if (total >= min) stage = idx; });
    return stage;
  }

  function updatePowerPerSecondDisplay() {
    const ps = calcPerSecond();
    if (ps > 0) {
      powerPerSecondEl.hidden = false;
      powerPerSecondEl.textContent = '毎秒 +' + formatNumber(ps) + 'P';
    } else {
      powerPerSecondEl.hidden = true;
    }
  }

  function updateTopDisplay(stageIdx) {
    powerPValue.textContent = formatNumber(powerWallet);
    titleValue.textContent = TITLES[stageIdx];
    if (stageIdx >= STAGE_THRESHOLDS.length - 1) {
      progressTrack.hidden = true;
      progressMax.hidden = false;
    } else {
      progressTrack.hidden = false;
      progressMax.hidden = true;
      const min = STAGE_THRESHOLDS[stageIdx];
      const max = STAGE_THRESHOLDS[stageIdx + 1];
      const pct = Math.max(0, Math.min(100, ((powerLifetime - min) / (max - min)) * 100));
      progressFill.style.width = pct + '%';
    }
    updatePowerPerSecondDisplay();
  }

  function refreshShopDisplay() {
    SHOP_ITEMS.forEach(item => {
      const price = priceFor(item);
      document.getElementById('owned-' + item.id).textContent = shopOwned[item.id];
      document.getElementById('price-' + item.id).textContent = formatNumber(price) + 'P';
      document.getElementById('buy-' + item.id).disabled = powerWallet < price;
    });
  }

  function buyItem(id) {
    const item = SHOP_ITEMS.find(i => i.id === id);
    const price = priceFor(item);
    if (powerWallet < price) return;
    powerWallet -= price;
    shopOwned[id] += 1;
    updateTopDisplay(currentStage);
    refreshShopDisplay();
    saveProgress();
  }

  function updateBodyStage() {
    const stageIdx = stageForTotal(powerLifetime);
    updateTopDisplay(stageIdx);
    if (stageIdx === currentStage) return;
    const previousStage = currentStage;
    currentStage = stageIdx;
    bodyImg.style.opacity = '0';
    setTimeout(() => {
      bodyImg.src = 'images/lv' + (stageIdx + 1) + '.png';
      bodyImg.style.opacity = '1';
      if (previousStage !== -1 && stageIdx > previousStage) {
        playLevelUpEffect(stageIdx);
      }
    }, 150);
  }

  function spawnLevelUpParticles() {
    levelupParticles.innerHTML = '';
    const count = 16;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      const isStar = Math.random() < 0.5;
      p.className = 'levelup-particle' + (isStar ? ' star' : '');
      if (isStar) p.textContent = '★';
      const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.5 - 0.25);
      const dist = 60 + Math.random() * 70;
      p.style.setProperty('--dx', (Math.cos(angle) * dist).toFixed(1) + 'px');
      p.style.setProperty('--dy', (Math.sin(angle) * dist).toFixed(1) + 'px');
      p.style.animationDelay = (Math.random() * 0.12).toFixed(2) + 's';
      levelupParticles.appendChild(p);
    }
    void levelupParticles.offsetWidth;
    levelupParticles.querySelectorAll('.levelup-particle').forEach(p => p.classList.add('show'));
  }

  function playLevelUpEffect(stageIdx) {
    clearTimeout(levelupTimer);
    levelupSub.textContent = TITLES[stageIdx] + ' に昇格！';

    levelupTextOverlay.classList.remove('show');
    levelupGlow.classList.remove('show');
    screenFlash.classList.remove('show');
    bodyImg.classList.remove('punch');
    void levelupTextOverlay.offsetWidth;

    levelupTextOverlay.classList.add('show');
    levelupGlow.classList.add('show');
    screenFlash.classList.add('show');
    bodyImg.classList.add('punch');
    spawnLevelUpParticles();

    levelupTimer = setTimeout(() => {
      levelupTextOverlay.classList.remove('show');
      levelupGlow.classList.remove('show');
      screenFlash.classList.remove('show');
      levelupParticles.innerHTML = '';
    }, 1500);
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pickChoiceKeys(correctKey) {
    const keys = Object.keys(parts);
    const wrongPool = shuffle(keys.filter(k => k !== correctKey));
    return shuffle([correctKey, ...wrongPool.slice(0, 3)]);
  }

  function buildQuizQuestions() {
    const keys = Object.keys(parts);
    const questions = [];
    for (let i = 0; i < QUIZ_QUESTION_COUNT; i++) {
      const key = keys[Math.floor(Math.random() * keys.length)];
      const type = Math.random() < 0.5 ? 'A' : 'B';
      const choiceKeys = pickChoiceKeys(key);
      const correctIndex = choiceKeys.indexOf(key);
      if (type === 'A') {
        questions.push({
          text: parts[key].name + 'は、どの部位の筋肉？',
          choices: choiceKeys.map(k => PART_LABELS[k]),
          correctIndex: correctIndex
        });
      } else {
        questions.push({
          text: PART_LABELS[key] + 'の筋肉の正式名称は？',
          choices: choiceKeys.map(k => parts[k].name),
          correctIndex: correctIndex
        });
      }
    }
    return questions;
  }

  function renderQuizQuestion() {
    quizAnswering = false;
    const q = quizQuestions[quizIndex];
    quizProgress.textContent = (quizIndex + 1) + '問目 / ' + QUIZ_QUESTION_COUNT + '問';
    quizQuestionEl.textContent = q.text;
    quizFeedbackText.hidden = true;
    quizChoicesEl.innerHTML = '';
    q.choices.forEach((label, idx) => {
      const btn = document.createElement('button');
      btn.className = 'quiz-choice-btn';
      btn.textContent = label;
      btn.addEventListener('click', () => handleQuizAnswer(idx, btn));
      quizChoicesEl.appendChild(btn);
    });
  }

  function handleQuizAnswer(idx, btnEl) {
    if (quizAnswering) return;
    quizAnswering = true;
    const q = quizQuestions[quizIndex];
    const buttons = Array.from(quizChoicesEl.children);
    buttons.forEach(b => { b.disabled = true; });
    if (idx === q.correctIndex) {
      btnEl.classList.add('correct');
      quizCorrectCount++;
      quizFeedbackText.textContent = '正解！';
      quizFeedbackText.className = 'quiz-feedback-text correct';
    } else {
      btnEl.classList.add('wrong');
      buttons[q.correctIndex].classList.add('correct');
      quizFeedbackText.textContent = '正解は ' + q.choices[q.correctIndex];
      quizFeedbackText.className = 'quiz-feedback-text wrong';
    }
    quizFeedbackText.hidden = false;
    quizAdvanceTimer = setTimeout(() => {
      quizIndex++;
      if (quizIndex < quizQuestions.length) {
        renderQuizQuestion();
      } else {
        showQuizResult();
      }
    }, QUIZ_ANSWER_DELAY);
  }

  function showQuizResult() {
    quizQuestionView.hidden = true;
    quizResultView.hidden = false;
    quizResultTitle.textContent = quizCorrectCount + '問正解！';
    let bonus = quizCorrectCount * QUIZ_CORRECT_BONUS;
    const perfect = quizCorrectCount === quizQuestions.length;
    if (perfect) bonus += QUIZ_PERFECT_BONUS;
    quizResultBonus.textContent = '＋' + formatNumber(bonus) + 'P 獲得';
    quizResultPerfect.hidden = !perfect;
    quizPendingBonus = bonus;
  }

  function openQuiz() {
    quizQuestions = buildQuizQuestions();
    quizIndex = 0;
    quizCorrectCount = 0;
    quizPendingBonus = 0;
    quizQuestionView.hidden = false;
    quizResultView.hidden = true;
    quizOverlay.hidden = false;
    renderQuizQuestion();
  }

  function closeQuiz() {
    clearTimeout(quizAdvanceTimer);
    const bonus = quizPendingBonus;
    quizPendingBonus = 0;
    quizOverlay.hidden = true;
    if (bonus > 0) {
      powerWallet += bonus;
      powerLifetime += bonus;
      updateBodyStage();
      refreshShopDisplay();
      saveProgress();
    }
  }

  function saveProgress() {
    const data = {};
    Object.keys(parts).forEach(key => { data[key] = parts[key].count; });
    data.powerWallet = powerWallet;
    data.powerLifetime = powerLifetime;
    data.shopOwned = shopOwned;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function loadProgress() {
    let saved;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { saved = null; }
    if (!saved) return;
    Object.keys(parts).forEach(key => {
      if (typeof saved[key] === 'number' && saved[key] > 0) {
        parts[key].count = saved[key];
        document.getElementById('count-' + key).textContent = saved[key] + '回';
      }
    });
    const tapTotal = Object.keys(parts).reduce((sum, key) => sum + parts[key].count, 0);
    powerLifetime = typeof saved.powerLifetime === 'number' ? saved.powerLifetime : tapTotal;
    powerWallet = typeof saved.powerWallet === 'number' ? saved.powerWallet : powerLifetime;
    if (saved.shopOwned) {
      Object.keys(shopOwned).forEach(id => {
        if (typeof saved.shopOwned[id] === 'number' && saved.shopOwned[id] > 0) {
          shopOwned[id] = saved.shopOwned[id];
        }
      });
    }
    if (tapTotal > 0) {
      infoName.textContent = 'おかえりなさい！';
      infoDesc.textContent = 'ここまで育てたマッチョです。続きを鍛えましょう';
    }
  }

  document.querySelectorAll('.part-status').forEach(zone => {
    zone.addEventListener('click', () => {
      const part = zone.dataset.part;
      const p = parts[part];
      p.count += 1;
      document.getElementById('count-' + part).textContent = p.count + '回';
      infoName.textContent = p.name;
      infoDesc.textContent = p.desc;
      const gain = 1 + calcTapBonus();
      powerWallet += gain;
      powerLifetime += gain;
      updateBodyStage();
      refreshShopDisplay();
      saveProgress();
    });
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (!window.confirm('本当に最初からやり直しますか？')) return;
    Object.keys(parts).forEach(key => {
      parts[key].count = 0;
      document.getElementById('count-' + key).textContent = '0回';
    });
    powerWallet = 0;
    powerLifetime = 0;
    Object.keys(shopOwned).forEach(id => { shopOwned[id] = 0; });
    infoName.textContent = 'さあ、鍛えよう！';
    infoDesc.textContent = 'キャラクターの体（胸・腕・脚・肩・背中・腹）をタップして筋トレを始めましょう';
    updateBodyStage();
    refreshShopDisplay();
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  });

  SHOP_ITEMS.forEach(item => {
    const div = document.createElement('div');
    div.className = 'shop-item';
    div.innerHTML =
      '<div class="shop-item-info">' +
        '<div class="shop-item-name">' + item.name + '</div>' +
        '<div class="shop-item-desc">' + item.desc + '</div>' +
        '<div class="shop-item-owned">所持数: <span class="owned-val" id="owned-' + item.id + '">0</span></div>' +
      '</div>' +
      '<button class="shop-buy-btn" id="buy-' + item.id + '" data-id="' + item.id + '">' +
        '<span class="price-val" id="price-' + item.id + '">' + formatNumber(item.basePrice) + 'P</span>' +
        '<span class="buy-label">買う</span>' +
      '</button>';
    shopListEl.appendChild(div);
  });

  shopListEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.shop-buy-btn');
    if (!btn || btn.disabled) return;
    buyItem(btn.dataset.id);
  });

  quizOpenBtn.addEventListener('click', openQuiz);
  quizCloseBtn.addEventListener('click', closeQuiz);

  setInterval(() => {
    const ps = calcPerSecond();
    if (ps <= 0) return;
    powerWallet += ps;
    powerLifetime += ps;
    updateBodyStage();
    refreshShopDisplay();
    saveProgress();
  }, 1000);

  loadProgress();
  currentStage = stageForTotal(powerLifetime);
  bodyImg.src = 'images/lv' + (currentStage + 1) + '.png';
  updateTopDisplay(currentStage);
  refreshShopDisplay();
</script>
</body>
</html>

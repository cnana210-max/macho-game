<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>マッチョ育成ゲーム</title>
<style>
  :root {
    color-scheme: light;
    --bg-top: #fff2e0;
    --bg-bottom: #ffd9a8;
    --skin: #e8b98a;
    --skin-shade: #d1985f;
    --accent: #ff6b35;
    --accent-dark: #e0501d;
    --ink: #3a2a1a;
    --panel: #ffffff;
    --red: #e23b2e;
    --gold: #f5c518;
    --blue: #2b5fa8;
    --white: #ffffff;
    --outline: #3a2419;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: var(--ink);
  }
  body {
    display: flex;
    justify-content: center;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    min-height: 100vh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .app {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 16px 16px 24px;
  }
  h1 {
    text-align: center;
    font-size: clamp(20px, 5vw, 28px);
    margin: 4px 0 12px;
    letter-spacing: 0.05em;
  }
  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 300px;
    padding: 12px 0;
  }
  .character {
    width: 220px;
    height: 300px;
    overflow: visible;
  }
  .outlined {
    stroke: var(--outline);
    stroke-width: 5;
    stroke-linejoin: round;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
  .body-silhouette {
    fill: var(--skin);
    transition: d 0.3s ease;
  }
  .detail-line {
    stroke: var(--outline);
    stroke-width: 2.5;
    stroke-linecap: round;
    fill: none;
    opacity: 0.55;
  }
  .tap-zone {
    fill: transparent;
    cursor: pointer;
    touch-action: manipulation;
    pointer-events: all;
  }
  .tap-zone:active ~ .body-silhouette { filter: brightness(0.97); }
  .info {
    background: var(--panel);
    border-radius: 16px;
    padding: 14px 16px;
    margin: 0 0 14px;
    min-height: 64px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .info .name {
    font-size: clamp(17px, 4.5vw, 20px);
    font-weight: bold;
    color: var(--accent-dark);
  }
  .info .desc {
    font-size: clamp(14px, 3.8vw, 16px);
    line-height: 1.4;
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px 10px;
  }
  .part-status {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 6px;
    border-radius: 18px;
    background: var(--accent);
    color: #fff;
  }
  .btn-label {
    font-size: clamp(18px, 5vw, 22px);
    font-weight: bold;
  }
  .btn-count {
    font-size: clamp(13px, 3.5vw, 15px);
    opacity: 0.9;
  }
  .reset-wrap {
    display: flex;
    justify-content: center;
    margin-top: 22px;
  }
  .reset-btn {
    -webkit-appearance: none;
    appearance: none;
    padding: 8px 20px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--skin-shade);
    border-radius: 999px;
    opacity: 0.6;
    touch-action: manipulation;
  }
  .reset-btn:active {
    opacity: 1;
  }
  @media (max-height: 640px) {
    .character { width: 165px; height: 225px; }
    .stage { min-height: 225px; padding: 6px 0 12px; }
    h1 { margin: 2px 0 8px; }
    .info { padding: 10px 14px; min-height: 52px; margin-bottom: 10px; }
    .reset-wrap { margin-top: 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>マッチョ育成ゲーム</h1>
  <div class="stage">
    <svg class="character" viewBox="0 0 220 300" xmlns="http://www.w3.org/2000/svg">
      <path d="M96,55 C80,58 58,64 46,80 C34,96 30,122 33,150
               C35,178 41,206 52,230 C60,240 66,236 62,224
               L58,168 C56,128 60,90 96,55 Z"
        fill="var(--red)" class="outlined" pointer-events="none" />
      <g pointer-events="none" opacity="0.6">
        <circle cx="52" cy="100" r="4" fill="#ffb3c6" />
        <circle cx="64" cy="88" r="3.5" fill="#b3e5ff" />
        <circle cx="42" cy="128" r="4" fill="#fff3b0" />
        <circle cx="56" cy="140" r="3.5" fill="#c8f7c5" />
        <circle cx="38" cy="160" r="4" fill="#d8b3ff" />
        <circle cx="52" cy="176" r="3.5" fill="#ffd0a8" />
        <circle cx="44" cy="196" r="4" fill="#b3e5ff" />
        <circle cx="58" cy="206" r="3.5" fill="#ffb3c6" />
        <circle cx="50" cy="220" r="3.5" fill="#fff3b0" />
        <circle cx="68" cy="118" r="3" fill="#c8f7c5" />
      </g>

      <path id="bodySilhouette" class="body-silhouette outlined" d="" />

      <path class="detail-line" d="M110,66 L110,94" />
      <path class="detail-line" d="M100,128 L120,128" />
      <path class="detail-line" d="M100,138 L120,138" />
      <path class="detail-line" d="M100,148 L120,148" />

      <rect x="74" y="163" width="72" height="26" rx="12" fill="var(--blue)" class="outlined" pointer-events="none" />
      <path d="M93,167 L94.4,171.6 L99,173 L94.4,174.4 L93,179 L91.6,174.4 L87,173 L91.6,171.6 Z"
        fill="var(--gold)" class="outlined" pointer-events="none" />
      <path d="M112,174 L113.4,178.6 L118,180 L113.4,181.4 L112,186 L110.6,181.4 L106,180 L110.6,178.6 Z"
        fill="var(--gold)" class="outlined" pointer-events="none" />
      <path d="M126,164 L127.4,168.6 L132,170 L127.4,171.4 L126,176 L124.6,171.4 L120,170 L124.6,168.6 Z"
        fill="var(--gold)" class="outlined" pointer-events="none" />

      <rect x="72" y="205" width="34" height="65" rx="12" fill="var(--white)" class="outlined" pointer-events="none" />
      <rect x="114" y="205" width="34" height="65" rx="12" fill="var(--white)" class="outlined" pointer-events="none" />

      <ellipse cx="110" cy="34" rx="27" ry="26" fill="var(--white)" class="outlined" pointer-events="none" />
      <rect x="107" y="8" width="6" height="32" rx="3" fill="var(--red)" pointer-events="none" />

      <ellipse cx="95" cy="32" rx="8" ry="6" fill="var(--red)" class="outlined" pointer-events="none" />
      <ellipse cx="125" cy="32" rx="8" ry="6" fill="var(--red)" class="outlined" pointer-events="none" />
      <circle cx="95" cy="32" r="3.5" fill="#fff" pointer-events="none" />
      <circle cx="125" cy="32" r="3.5" fill="#fff" pointer-events="none" />

      <path d="M99,45 C99,50 104,54 110,54 C116,54 121,50 121,45 C121,52 116,58 110,58 C104,58 99,52 99,45 Z"
        fill="var(--red)" class="outlined" pointer-events="none" />
      <ellipse cx="110" cy="49" rx="5.5" ry="2.5" fill="var(--outline)" pointer-events="none" />

      <rect class="tap-zone" data-part="shoulder" x="38" y="50" width="47" height="42" />
      <rect class="tap-zone" data-part="shoulder" x="135" y="50" width="47" height="42" />
      <rect class="tap-zone" data-part="chest" x="90" y="58" width="40" height="57" />
      <rect class="tap-zone" data-part="back" x="75" y="95" width="10" height="73" />
      <rect class="tap-zone" data-part="back" x="135" y="95" width="10" height="73" />
      <rect class="tap-zone" data-part="arm" x="28" y="90" width="47" height="76" />
      <rect class="tap-zone" data-part="arm" x="145" y="90" width="47" height="76" />
      <rect class="tap-zone" data-part="abs" x="85" y="115" width="50" height="53" />
      <rect class="tap-zone" data-part="leg" x="58" y="168" width="52" height="100" />
      <rect class="tap-zone" data-part="leg" x="110" y="168" width="52" height="100" />
    </svg>
  </div>
  <div class="info" id="info">
    <div class="name">さあ、鍛えよう！</div>
    <div class="desc">キャラクターの体（胸・腕・脚・肩・背中・腹）をタップして筋トレを始めましょう</div>
  </div>
  <div class="controls">
    <div class="part-status">
      <span class="btn-label">胸</span>
      <span class="btn-count" id="count-chest">0回</span>
    </div>
    <div class="part-status">
      <span class="btn-label">腕</span>
      <span class="btn-count" id="count-arm">0回</span>
    </div>
    <div class="part-status">
      <span class="btn-label">脚</span>
      <span class="btn-count" id="count-leg">0回</span>
    </div>
    <div class="part-status">
      <span class="btn-label">肩</span>
      <span class="btn-count" id="count-shoulder">0回</span>
    </div>
    <div class="part-status">
      <span class="btn-label">背中</span>
      <span class="btn-count" id="count-back">0回</span>
    </div>
    <div class="part-status">
      <span class="btn-label">腹</span>
      <span class="btn-count" id="count-abs">0回</span>
    </div>
  </div>
  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">最初から</button>
  </div>
</div>
<script>
  const parts = {
    chest: { name: '大胸筋', desc: '胸の中心を覆う大きな筋肉。押す動作で使われます。', count: 0 },
    arm: { name: '上腕二頭筋', desc: '腕の力こぶ。ものを持ち上げる動作で使われます。', count: 0 },
    leg: { name: '大腿四頭筋', desc: '太ももの前側の筋肉。歩く・走るときに使われます。', count: 0 },
    shoulder: { name: '三角筋', desc: '肩を丸く覆う筋肉。腕を横に上げる動作で使われます。', count: 0 },
    back: { name: '広背筋', desc: '背中を大きく広げる筋肉。逆三角形の体型を作ります。', count: 0 },
    abs: { name: '腹直筋', desc: 'お腹の中心を縦に走る筋肉。腹筋運動で鍛えられます。', count: 0 }
  };

  const infoName = document.querySelector('#info .name');
  const infoDesc = document.querySelector('#info .desc');
  const bodyEl = document.getElementById('bodySilhouette');
  const STORAGE_KEY = 'macho-game-progress';
  const STAGE_THRESHOLDS = [0, 10, 30, 60, 100];

  function smoothClosedPath(points) {
    const n = points.length;
    let d = 'M ' + points[0][0].toFixed(1) + ',' + points[0][1].toFixed(1) + ' ';
    for (let i = 0; i < n; i++) {
      const p0 = points[(i - 1 + n) % n];
      const p1 = points[i];
      const p2 = points[(i + 1) % n];
      const p3 = points[(i + 2) % n];
      const c1x = p1[0] + (p2[0] - p0[0]) / 10;
      const c1y = p1[1] + (p2[1] - p0[1]) / 10;
      const c2x = p2[0] - (p3[0] - p1[0]) / 10;
      const c2y = p2[1] - (p3[1] - p1[1]) / 10;
      d += 'C ' + c1x.toFixed(1) + ',' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ',' + c2y.toFixed(1) + ' ' + p2[0].toFixed(1) + ',' + p2[1].toFixed(1) + ' ';
    }
    return d + 'Z';
  }

  function bodyPoints(p) {
    const inner = {
      wrist: p.wrist - 4,
      elbow: p.elbow - 6,
      ankle: p.ankle - 4,
      calf: p.calf - 12,
      knee: p.knee - 8
    };
    const left = [
      [110 - p.neckW, 50],
      [110 - p.shoulder, 72],
      [110 - p.bicep, 86],
      [110 - p.bicep, 98],
      [110 - p.elbow, 100],
      [110 - p.wrist, 118],
      [110 - p.fist, 130],
      [110 - inner.wrist, 116],
      [110 - inner.elbow, 102],
      [110 - p.armpit, 92],
      [110 - p.chest, 150],
      [110 - p.waist, 160],
      [110 - p.hip, 172],
      [110 - p.thigh, 188],
      [110 - p.knee, 218],
      [110 - p.calf, 240],
      [110 - p.ankle, 260],
      [110 - p.foot, 270],
      [110 - inner.ankle, 260],
      [110 - inner.calf, 240],
      [110 - inner.knee, 218],
      [110 - p.crotch, 186]
    ];
    const right = left.slice().reverse().map(([x, y]) => [220 - x, y]);
    return left.concat(right);
  }

  function buildBodyPath(p) {
    return smoothClosedPath(bodyPoints(p));
  }

  const SLIM = { neckW: 15, shoulder: 34, bicep: 42, elbow: 32, wrist: 27, fist: 31, armpit: 15, chest: 30, waist: 23, hip: 28, thigh: 27, knee: 19, calf: 23, ankle: 15, foot: 20, crotch: 8 };
  const BUFF = { neckW: 18, shoulder: 62, bicep: 84, elbow: 56, wrist: 42, fist: 47, armpit: 30, chest: 48, waist: 34, hip: 44, thigh: 44, knee: 28, calf: 38, ankle: 21, foot: 27, crotch: 8 };

  function lerpParams(t) {
    const out = {};
    Object.keys(SLIM).forEach(k => { out[k] = SLIM[k] + (BUFF[k] - SLIM[k]) * t; });
    return out;
  }

  const STAGE_PATHS = [0, 0.25, 0.5, 0.75, 1].map(t => buildBodyPath(lerpParams(t)));

  function stageForTotal(total) {
    let stage = 0;
    STAGE_THRESHOLDS.forEach((min, idx) => { if (total >= min) stage = idx; });
    return stage;
  }

  function updateBodyStage() {
    const total = Object.keys(parts).reduce((sum, key) => sum + parts[key].count, 0);
    const stageIdx = stageForTotal(total);
    bodyEl.style.d = 'path("' + STAGE_PATHS[stageIdx] + '")';
  }

  function saveProgress() {
    const data = {};
    Object.keys(parts).forEach(key => { data[key] = parts[key].count; });
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function loadProgress() {
    let saved;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { saved = null; }
    if (!saved) return;
    Object.keys(parts).forEach(key => {
      if (typeof saved[key] === 'number' && saved[key] > 0) {
        parts[key].count = saved[key];
        document.getElementById('count-' + key).textContent = saved[key] + '回';
      }
    });
    const total = Object.keys(parts).reduce((sum, key) => sum + parts[key].count, 0);
    if (total > 0) {
      infoName.textContent = 'おかえりなさい！';
      infoDesc.textContent = 'ここまで育てたマッチョです。続きを鍛えましょう';
    }
  }

  document.querySelectorAll('.tap-zone').forEach(zone => {
    zone.addEventListener('click', () => {
      const part = zone.dataset.part;
      const p = parts[part];
      p.count += 1;
      document.getElementById('count-' + part).textContent = p.count + '回';
      infoName.textContent = p.name;
      infoDesc.textContent = p.desc;
      updateBodyStage();
      saveProgress();
    });
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (!window.confirm('本当に最初からやり直しますか？')) return;
    Object.keys(parts).forEach(key => {
      parts[key].count = 0;
      document.getElementById('count-' + key).textContent = '0回';
    });
    infoName.textContent = 'さあ、鍛えよう！';
    infoDesc.textContent = 'キャラクターの体（胸・腕・脚・肩・背中・腹）をタップして筋トレを始めましょう';
    updateBodyStage();
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  });

  loadProgress();
  bodyEl.setAttribute('d', STAGE_PATHS[stageForTotal(Object.keys(parts).reduce((s, k) => s + parts[k].count, 0))]);
</script>
</body>
</html>

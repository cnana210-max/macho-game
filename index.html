<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>マッチョ育成ゲーム</title>
<style>
  :root {
    color-scheme: light;
    --bg-top: #fff2e0;
    --bg-bottom: #ffd9a8;
    --skin: #e8b98a;
    --skin-shade: #d1985f;
    --accent: #ff6b35;
    --accent-dark: #e0501d;
    --ink: #3a2a1a;
    --panel: #ffffff;
    --red: #e23b2e;
    --gold: #f5c518;
    --teal: #3e8e8a;
    --outline: #1c1a17;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: var(--ink);
  }
  body {
    display: flex;
    justify-content: center;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    min-height: 100vh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .app {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 16px 16px 24px;
  }
  h1 {
    text-align: center;
    font-size: clamp(20px, 5vw, 28px);
    margin: 4px 0 12px;
    letter-spacing: 0.05em;
  }
  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 300px;
    padding: 12px 0;
  }
  .character {
    width: 220px;
    height: 300px;
    overflow: visible;
  }
  .outlined {
    stroke: var(--outline);
    stroke-width: 4.5;
    stroke-linejoin: round;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
  .skin { fill: var(--skin); }
  .tap-shape {
    cursor: pointer;
    touch-action: manipulation;
  }
  .tap-shape:active { filter: brightness(0.9); }
  .grown {
    transform-box: fill-box;
  }
  .torso-shape { transform-origin: 50% 0%; transform: scaleX(var(--grow, 1)); }
  .abs-shape { transform-origin: 50% 0%; transform: scale(var(--grow, 1)); }
  .shoulder-left-shape { transform-origin: 100% 50%; transform: scale(var(--grow, 1)); }
  .shoulder-right-shape { transform-origin: 0% 50%; transform: scale(var(--grow, 1)); }
  .back-left-shape { transform-origin: 100% 50%; transform: scaleX(var(--grow, 1)); }
  .back-right-shape { transform-origin: 0% 50%; transform: scaleX(var(--grow, 1)); }
  .leg-left-shape, .leg-right-shape { transform-origin: 0% 0%; transform: scaleX(var(--grow, 1)); }
  .arm-left-shape { transform-origin: 100% 0%; transform: rotate(8deg) scaleX(var(--grow, 1)); }
  .arm-right-shape { transform-origin: 0% 0%; transform: rotate(-8deg) scaleX(var(--grow, 1)); }
  .wristband-left-shape { transform-origin: 100% 0%; transform: rotate(8deg) scaleX(var(--grow, 1)); }
  .wristband-right-shape { transform-origin: 0% 0%; transform: rotate(-8deg) scaleX(var(--grow, 1)); }
  .info {
    background: var(--panel);
    border-radius: 16px;
    padding: 14px 16px;
    margin: 0 0 14px;
    min-height: 64px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .info .name {
    font-size: clamp(17px, 4.5vw, 20px);
    font-weight: bold;
    color: var(--accent-dark);
  }
  .info .desc {
    font-size: clamp(14px, 3.8vw, 16px);
    line-height: 1.4;
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px 10px;
  }
  .part-status {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 6px;
    border-radius: 18px;
    background: var(--accent);
    color: #fff;
  }
  .btn-label {
    font-size: clamp(18px, 5vw, 22px);
    font-weight: bold;
  }
  .btn-count {
    font-size: clamp(13px, 3.5vw, 15px);
    opacity: 0.9;
  }
  .reset-wrap {
    display: flex;
    justify-content: center;
    margin-top: 22px;
  }
  .reset-btn {
    -webkit-appearance: none;
    appearance: none;
    padding: 8px 20px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--skin-shade);
    border-radius: 999px;
    opacity: 0.6;
    touch-action: manipulation;
  }
  .reset-btn:active {
    opacity: 1;
  }
  @media (max-height: 640px) {
    .character { width: 165px; height: 225px; }
    .stage { min-height: 225px; padding: 6px 0 12px; }
    h1 { margin: 2px 0 8px; }
    .info { padding: 10px 14px; min-height: 52px; margin-bottom: 10px; }
    .reset-wrap { margin-top: 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>マッチョ育成ゲーム</h1>
  <div class="stage">
    <svg class="character" viewBox="0 0 220 300" xmlns="http://www.w3.org/2000/svg">
      <rect x="97" y="48" width="26" height="18" rx="9" class="skin" />

      <path class="grown torso-shape outlined skin tap-shape" data-part="chest"
        d="M86,58 C78,68 80,80 83,88 C80,105 78,122 81,138 C79,148 78,158 87,165
           L133,165 C142,158 141,148 139,138 C142,122 140,105 137,88
           C140,80 142,68 134,58 C122,50 98,50 86,58 Z" />

      <rect class="grown back-left-shape outlined skin tap-shape" data-part="back" x="66" y="148" width="16" height="20" rx="8" />
      <rect class="grown back-right-shape outlined skin tap-shape" data-part="back" x="138" y="148" width="16" height="20" rx="8" />

      <rect class="grown abs-shape outlined tap-shape" data-part="abs" x="92" y="120" width="36" height="32" rx="16" fill="var(--skin-shade)" />

      <rect class="grown leg-left-shape outlined skin tap-shape" data-part="leg" x="82" y="168" width="24" height="95" rx="12" />
      <rect class="grown leg-right-shape outlined skin tap-shape" data-part="leg" x="114" y="168" width="24" height="95" rx="12" />

      <rect x="76" y="163" width="68" height="26" rx="12" fill="var(--red)" class="outlined" pointer-events="none" />
      <rect x="76" y="163" width="68" height="10" rx="5" fill="var(--gold)" class="outlined" pointer-events="none" />

      <rect x="78" y="218" width="30" height="50" rx="10" fill="var(--red)" class="outlined" pointer-events="none" />
      <rect x="78" y="218" width="30" height="10" rx="5" fill="var(--gold)" class="outlined" pointer-events="none" />
      <rect x="112" y="218" width="30" height="50" rx="10" fill="var(--red)" class="outlined" pointer-events="none" />
      <rect x="112" y="218" width="30" height="10" rx="5" fill="var(--gold)" class="outlined" pointer-events="none" />

      <circle class="grown shoulder-left-shape outlined skin tap-shape" data-part="shoulder" cx="76" cy="64" r="18" />
      <circle class="grown shoulder-right-shape outlined skin tap-shape" data-part="shoulder" cx="144" cy="64" r="18" />

      <rect class="grown arm-left-shape outlined skin tap-shape" data-part="arm" x="50" y="66" width="16" height="95" rx="8" />
      <rect class="grown arm-right-shape outlined skin tap-shape" data-part="arm" x="154" y="66" width="16" height="95" rx="8" />

      <rect class="grown wristband-left-shape outlined" x="50" y="140" width="16" height="11" rx="4" fill="var(--teal)" pointer-events="none" />
      <rect class="grown wristband-right-shape outlined" x="154" y="140" width="16" height="11" rx="4" fill="var(--teal)" pointer-events="none" />

      <rect x="107" y="8" width="6" height="32" rx="3" fill="var(--gold)" pointer-events="none" />
      <ellipse cx="110" cy="34" rx="27" ry="26" fill="var(--red)" class="outlined" pointer-events="none" />

      <ellipse cx="95" cy="32" rx="8" ry="6" fill="var(--gold)" class="outlined" pointer-events="none" />
      <ellipse cx="125" cy="32" rx="8" ry="6" fill="var(--gold)" class="outlined" pointer-events="none" />
      <circle cx="95" cy="32" r="3.5" fill="#fff" pointer-events="none" />
      <circle cx="125" cy="32" r="3.5" fill="#fff" pointer-events="none" />

      <path d="M99,45 C99,50 104,54 110,54 C116,54 121,50 121,45 C121,52 116,58 110,58 C104,58 99,52 99,45 Z"
        fill="var(--gold)" class="outlined" pointer-events="none" />
      <ellipse cx="110" cy="49" rx="5.5" ry="2.5" fill="var(--outline)" pointer-events="none" />
    </svg>
  </div>
  <div class="info" id="info">
    <div class="name">さあ、鍛えよう！</div>
    <div class="desc">キャラクターの体（胸・腕・脚・肩・背中・腹）をタップして筋トレを始めましょう</div>
  </div>
  <div class="controls">
    <div class="part-status">
      <span class="btn-label">胸</span>
      <span class="btn-count" id="count-chest">0回</span>
    </div>
    <div class="part-status">
      <span class="btn-label">腕</span>
      <span class="btn-count" id="count-arm">0回</span>
    </div>
    <div class="part-status">
      <span class="btn-label">脚</span>
      <span class="btn-count" id="count-leg">0回</span>
    </div>
    <div class="part-status">
      <span class="btn-label">肩</span>
      <span class="btn-count" id="count-shoulder">0回</span>
    </div>
    <div class="part-status">
      <span class="btn-label">背中</span>
      <span class="btn-count" id="count-back">0回</span>
    </div>
    <div class="part-status">
      <span class="btn-label">腹</span>
      <span class="btn-count" id="count-abs">0回</span>
    </div>
  </div>
  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">最初から</button>
  </div>
</div>
<script>
  function elsFor(part) {
    const shapes = Array.from(document.querySelectorAll('[data-part="' + part + '"]'));
    const bands = part === 'arm' ? Array.from(document.querySelectorAll('.wristband-left-shape, .wristband-right-shape')) : [];
    return shapes.concat(bands);
  }

  const parts = {
    chest: {
      name: '大胸筋',
      desc: '胸の中心を覆う大きな筋肉。押す動作で使われます。',
      els: elsFor('chest'),
      baseWidth: 100,
      maxAdd: 70,
      count: 0
    },
    arm: {
      name: '上腕二頭筋',
      desc: '腕の力こぶ。ものを持ち上げる動作で使われます。',
      els: elsFor('arm'),
      baseWidth: 100,
      maxAdd: 90,
      count: 0
    },
    leg: {
      name: '大腿四頭筋',
      desc: '太ももの前側の筋肉。歩く・走るときに使われます。',
      els: elsFor('leg'),
      baseWidth: 100,
      maxAdd: 80,
      count: 0
    },
    shoulder: {
      name: '三角筋',
      desc: '肩を丸く覆う筋肉。腕を横に上げる動作で使われます。',
      els: elsFor('shoulder'),
      baseWidth: 100,
      maxAdd: 90,
      count: 0
    },
    back: {
      name: '広背筋',
      desc: '背中を大きく広げる筋肉。逆三角形の体型を作ります。',
      els: elsFor('back'),
      baseWidth: 100,
      maxAdd: 90,
      count: 0
    },
    abs: {
      name: '腹直筋',
      desc: 'お腹の中心を縦に走る筋肉。腹筋運動で鍛えられます。',
      els: elsFor('abs'),
      baseWidth: 100,
      maxAdd: 60,
      count: 0
    }
  };

  const infoName = document.querySelector('#info .name');
  const infoDesc = document.querySelector('#info .desc');
  const TAPS_TO_MAX = 15;
  const STORAGE_KEY = 'macho-game-progress';

  function applyGrowth(part) {
    const p = parts[part];
    const growth = Math.min(p.count, TAPS_TO_MAX) / TAPS_TO_MAX;
    const ratio = (p.baseWidth + p.maxAdd * growth) / p.baseWidth;
    p.els.forEach(el => { el.style.setProperty('--grow', ratio); });
  }

  function saveProgress() {
    const data = {};
    Object.keys(parts).forEach(key => { data[key] = parts[key].count; });
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function loadProgress() {
    let saved;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { saved = null; }
    if (!saved) return;
    Object.keys(parts).forEach(key => {
      if (typeof saved[key] === 'number' && saved[key] > 0) {
        parts[key].count = saved[key];
        document.getElementById('count-' + key).textContent = saved[key] + '回';
        applyGrowth(key);
      }
    });
    const total = Object.keys(parts).reduce((sum, key) => sum + parts[key].count, 0);
    if (total > 0) {
      infoName.textContent = 'おかえりなさい！';
      infoDesc.textContent = 'ここまで育てたマッチョです。続きを鍛えましょう';
    }
  }

  document.querySelectorAll('.tap-shape').forEach(shape => {
    shape.addEventListener('click', () => {
      const part = shape.dataset.part;
      const p = parts[part];
      p.count += 1;
      document.getElementById('count-' + part).textContent = p.count + '回';
      applyGrowth(part);
      infoName.textContent = p.name;
      infoDesc.textContent = p.desc;
      saveProgress();
    });
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (!window.confirm('本当に最初からやり直しますか？')) return;
    Object.keys(parts).forEach(key => {
      parts[key].count = 0;
      document.getElementById('count-' + key).textContent = '0回';
      applyGrowth(key);
    });
    infoName.textContent = 'さあ、鍛えよう！';
    infoDesc.textContent = 'キャラクターの体（胸・腕・脚・肩・背中・腹）をタップして筋トレを始めましょう';
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  });

  Object.keys(parts).forEach(key => applyGrowth(key));
  loadProgress();
</script>
</body>
</html>

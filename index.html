<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>マッチョ育成ゲーム</title>
<style>
  :root {
    color-scheme: dark;
    --bg-top: #14101c;
    --bg-bottom: #0a0a0f;
    --skin: #e8b98a;
    --skin-shade: #6b6478;
    --accent: #ff7a45;
    --accent-dark: #e0501d;
    --ink: #f5f3f7;
    --desc: #c9c4d1;
    --panel: #1e1a26;
    --red: #ff4d3d;
    --gold: #f5c518;
    --blue: #2b5fa8;
    --white: #ffffff;
    --outline: #3a2419;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: var(--ink);
  }
  body {
    display: flex;
    justify-content: center;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    min-height: 100vh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .app {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 16px 16px 24px;
  }
  h1 {
    text-align: center;
    font-size: clamp(20px, 5vw, 28px);
    margin: 4px 0 12px;
    letter-spacing: 0.05em;
  }
  .offline-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--panel);
    border-radius: 14px;
    padding: 10px 14px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    animation: bannerSlideDown 0.3s ease;
  }
  .offline-banner[hidden] {
    display: none;
  }
  .offline-banner.hide {
    animation: bannerSlideUp 0.3s ease forwards;
  }
  @keyframes bannerSlideDown {
    0% { opacity: 0; transform: translateY(-10px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes bannerSlideUp {
    0% { opacity: 1; transform: translateY(0); max-height: 80px; margin-bottom: 10px; }
    100% { opacity: 0; transform: translateY(-10px); max-height: 0; margin-bottom: 0; }
  }
  .offline-banner-text {
    font-size: clamp(12px, 3.6vw, 14px);
    font-weight: bold;
    line-height: 1.4;
    flex: 1;
  }
  .offline-banner-btn {
    -webkit-appearance: none;
    appearance: none;
    flex-shrink: 0;
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    font-weight: bold;
    font-size: clamp(12px, 3.6vw, 14px);
    cursor: pointer;
    touch-action: manipulation;
  }
  .offline-banner-btn:active {
    filter: brightness(0.9);
  }
  .daily-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--panel);
    border-radius: 14px;
    padding: 10px 14px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    animation: bannerSlideDown 0.3s ease;
  }
  .daily-banner[hidden] {
    display: none;
  }
  .daily-banner.hide {
    animation: bannerSlideUp 0.3s ease forwards;
  }
  .daily-banner-text {
    font-size: clamp(12px, 3.6vw, 14px);
    font-weight: bold;
    line-height: 1.4;
    flex: 1;
  }
  .daily-banner-btn {
    -webkit-appearance: none;
    appearance: none;
    flex-shrink: 0;
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    background: var(--gold);
    color: #1c1508;
    font-family: inherit;
    font-weight: bold;
    font-size: clamp(12px, 3.6vw, 14px);
    cursor: pointer;
    touch-action: manipulation;
  }
  .daily-banner-btn:active {
    filter: brightness(0.9);
  }
  .top-stats {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }
  .stat-box {
    flex: 1;
    background: var(--panel);
    border-radius: 14px;
    padding: 10px 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .stat-label {
    font-size: 12px;
    opacity: 0.65;
    font-weight: bold;
    color: var(--desc);
  }
  .stat-value {
    font-size: clamp(18px, 5.5vw, 24px);
    font-weight: bold;
    color: #fff;
    line-height: 1.3;
  }
  #titleValue {
    color: var(--gold);
  }
  .progress-track {
    height: 8px;
    background: #3a3444;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 6px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
  }
  .progress-max {
    margin-top: 6px;
    font-size: 13px;
    font-weight: bold;
    color: var(--gold);
  }
  .stat-sub {
    margin-top: 4px;
    font-size: 11px;
    font-weight: bold;
    color: #fff;
    opacity: 0.75;
  }
  .stage {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 300px;
    padding: 12px 0;
  }
  .character-wrap {
    position: relative;
    height: 100%;
    max-height: 300px;
    width: fit-content;
    max-width: 100%;
  }
  .character-wrap.wobble {
    animation: charWobble 0.3s ease;
  }
  @keyframes charWobble {
    0% { transform: rotate(0deg) translateX(0); }
    25% { transform: rotate(-1.2deg) translateX(-2px); }
    50% { transform: rotate(1deg) translateX(2px); }
    75% { transform: rotate(-0.5deg) translateX(-1px); }
    100% { transform: rotate(0deg) translateX(0); }
  }
  .part-glow-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .part-glow {
    position: absolute;
    width: 25%;
    aspect-ratio: 1;
    left: 0;
    top: 0;
    transform: translate(-50%, -50%) scale(0.6);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245,197,24,0.95) 0%, rgba(245,197,24,0.55) 40%, rgba(245,197,24,0) 75%);
    opacity: 0;
    animation: partGlowPulse 0.4s ease-out forwards;
  }
  @keyframes partGlowPulse {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    25% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.15); }
  }
  .back-halo {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 135%;
    height: 112%;
    transform: translate(-50%, -50%) scale(0.85);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245,197,24,0.9) 0%, rgba(245,197,24,0.5) 45%, rgba(245,197,24,0) 75%);
    opacity: 0;
    pointer-events: none;
  }
  .back-halo.show {
    animation: backHaloPulse 0.4s ease-out forwards;
  }
  @keyframes backHaloPulse {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.85); }
    35% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.15); }
  }
  .character-img {
    display: block;
    width: auto;
    height: 100%;
    max-height: 300px;
    max-width: 100%;
    object-fit: contain;
    transition: opacity 0.3s ease;
    filter: drop-shadow(0 14px 22px rgba(0,0,0,0.55));
  }
  .character-img.punch {
    animation: punchScale 0.4s ease-out 0.25s;
  }
  @keyframes punchScale {
    0% { transform: scale(1); }
    45% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .levelup-dim {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9997;
    opacity: 0;
    background: radial-gradient(circle at var(--spot-x, 50%) var(--spot-y, 45%), rgba(0,0,0,0) 0%, rgba(0,0,0,0) 18%, rgba(6,4,10,0.82) 65%);
  }
  .levelup-dim.show {
    animation: dimPulse 0.6s ease-out forwards;
  }
  @keyframes dimPulse {
    0% { opacity: 0; }
    25% { opacity: 1; }
    50% { opacity: 1; }
    100% { opacity: 0; }
  }
  .levelup-glow {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
  }
  .levelup-glow.show {
    animation: glowPulse 1.1s ease-out forwards;
  }
  .levelup-glow::before {
    content: '';
    width: 70%;
    aspect-ratio: 1;
    max-width: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245,197,24,0.9) 0%, rgba(245,197,24,0.4) 45%, rgba(245,197,24,0) 72%);
  }
  @keyframes glowPulse {
    0% { opacity: 0; transform: scale(0.6); }
    30% { opacity: 1; transform: scale(1.1); }
    100% { opacity: 0; transform: scale(1.35); }
  }
  .levelup-burst {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
  }
  .levelup-burst.show {
    animation: burstPulse 0.7s ease-out 0.28s forwards;
  }
  .levelup-burst::before {
    content: '';
    width: 40%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(245,197,24,0.85) 30%, rgba(245,197,24,0.3) 55%, rgba(245,197,24,0) 75%);
  }
  @keyframes burstPulse {
    0% { opacity: 0; transform: scale(0.3); }
    35% { opacity: 1; transform: scale(1.3); }
    100% { opacity: 0; transform: scale(2.2); }
  }
  .levelup-rings {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .levelup-ring {
    position: absolute;
    width: 32%;
    aspect-ratio: 1;
    border: 4px solid rgba(245,197,24,0.9);
    border-radius: 50%;
    opacity: 0;
  }
  .levelup-rings.show .ring1 {
    animation: ringExpand 0.9s ease-out 0.28s forwards;
  }
  .levelup-rings.show .ring2 {
    animation: ringExpand 0.9s ease-out 0.43s forwards;
  }
  @keyframes ringExpand {
    0% { opacity: 0.9; transform: scale(0.3); border-width: 6px; }
    100% { opacity: 0; transform: scale(2.6); border-width: 1px; }
  }
  .levelup-rays {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .levelup-ray {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 6px;
    height: 42%;
    margin-left: -3px;
    transform-origin: 50% 0%;
    transform: rotate(var(--ray-angle, 0deg)) scaleY(0);
    background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(245,197,24,0.75) 45%, rgba(245,197,24,0) 100%);
    clip-path: polygon(40% 0%, 60% 0%, 100% 22%, 55% 32%, 100% 52%, 50% 64%, 90% 78%, 50% 100%, 10% 78%, 45% 64%, 0% 52%, 45% 32%, 0% 22%);
    opacity: 0;
  }
  .levelup-rays.show .levelup-ray {
    animation: rayShoot 0.5s ease-out 0.28s forwards;
  }
  @keyframes rayShoot {
    0% { opacity: 0; transform: rotate(var(--ray-angle, 0deg)) scaleY(0); }
    30% { opacity: 1; transform: rotate(var(--ray-angle, 0deg)) scaleY(1.1); }
    100% { opacity: 0; transform: rotate(var(--ray-angle, 0deg)) scaleY(1); }
  }
  .levelup-particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .levelup-particle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0;
    transform: translate(-50%, -50%);
  }
  .levelup-particle.star {
    width: auto;
    height: auto;
    background: none;
    color: var(--gold);
    font-size: 15px;
    line-height: 1;
  }
  .levelup-particle.show {
    animation: particleBurst 1.1s ease-out forwards;
  }
  @keyframes particleBurst {
    0% { opacity: 0; transform: translate(-50%, -50%) translate(0, 0) scale(1); }
    12% { opacity: 1; }
    50% { opacity: 1; transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) translate(var(--dx), var(--fall-dy)) scale(0.5); }
  }
  .screen-flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 9998;
  }
  .screen-flash.show {
    animation: flashFade 0.4s ease-out 0.25s forwards;
  }
  @keyframes flashFade {
    0% { opacity: 0; }
    15% { opacity: 0.4; }
    100% { opacity: 0; }
  }
  .levelup-text-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 9999;
    opacity: 0;
    text-align: center;
    padding: 0 16px;
  }
  .levelup-text-overlay.show {
    animation: levelupOverlayFade 1.85s ease-out 0.15s forwards;
  }
  @keyframes levelupOverlayFade {
    0% { opacity: 0; }
    10% { opacity: 1; }
    78% { opacity: 1; }
    100% { opacity: 0; }
  }
  .levelup-main-text {
    font-size: clamp(38px, 12vw, 60px);
    font-weight: 900;
    color: var(--red);
    -webkit-text-stroke: 2px var(--gold);
    paint-order: stroke fill;
    text-shadow: 0 0 14px rgba(245,197,24,0.6), 0 0 6px rgba(0,0,0,0.3);
    letter-spacing: 0.03em;
    transform: scale(0.2);
  }
  .levelup-text-overlay.show .levelup-main-text {
    animation: levelupPopShake 1.85s cubic-bezier(.25,1.6,.4,1) forwards;
  }
  @keyframes levelupPopShake {
    0% { transform: scale(0.2) rotate(0deg); }
    15% { transform: scale(1.18) rotate(-2.5deg); }
    20% { transform: scale(1.05) rotate(2.5deg); }
    25% { transform: scale(1.1) rotate(-1.5deg); }
    30% { transform: scale(1) rotate(1deg); }
    35% { transform: scale(1) rotate(0deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  .levelup-sub-text {
    margin-top: 10px;
    font-size: clamp(15px, 4.2vw, 19px);
    font-weight: bold;
    color: #3a2a1a;
    background: rgba(255,255,255,0.88);
    padding: 5px 16px;
    border-radius: 999px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .info {
    background: var(--panel);
    border-radius: 16px;
    padding: 14px 16px;
    margin: 0 0 14px;
    min-height: 64px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .info .name {
    font-size: clamp(17px, 4.5vw, 20px);
    font-weight: bold;
    color: #fff;
  }
  .info .desc {
    font-size: clamp(14px, 3.8vw, 16px);
    line-height: 1.4;
    color: var(--desc);
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px 10px;
  }
  .part-status {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 6px;
    border-radius: 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    font-family: inherit;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.12s ease;
  }
  .part-status:active {
    filter: brightness(0.9);
    transform: scale(0.92);
  }
  .btn-label {
    font-size: clamp(18px, 5vw, 22px);
    font-weight: bold;
  }
  .btn-count {
    font-size: clamp(13px, 3.5vw, 15px);
    opacity: 0.9;
  }
  .quiz-open-btn {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    margin-top: 18px;
    padding: 14px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--blue), #1d3f73);
    color: #fff;
    font-family: inherit;
    font-weight: bold;
    font-size: clamp(15px, 4.5vw, 18px);
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  }
  .quiz-open-btn:active {
    filter: brightness(0.92);
  }
  .quiz-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 12, 5, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9985;
    padding: 20px;
  }
  .quiz-overlay[hidden] {
    display: none;
  }
  .quiz-card {
    background: var(--panel);
    border-radius: 20px;
    padding: 24px 20px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  .quiz-progress {
    font-size: 13px;
    font-weight: bold;
    opacity: 0.65;
    text-align: center;
    margin-bottom: 10px;
    color: var(--desc);
  }
  .quiz-question {
    font-size: clamp(16px, 4.6vw, 19px);
    font-weight: bold;
    text-align: center;
    margin-bottom: 18px;
    line-height: 1.5;
  }
  .quiz-choices {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .quiz-choice-btn {
    -webkit-appearance: none;
    appearance: none;
    border: 2px solid transparent;
    border-radius: 14px;
    padding: 14px 8px;
    background: var(--bg-top);
    color: var(--ink);
    font-family: inherit;
    font-weight: bold;
    font-size: clamp(13px, 3.8vw, 15px);
    cursor: pointer;
    touch-action: manipulation;
  }
  .quiz-choice-btn:disabled {
    cursor: default;
  }
  .quiz-choice-btn.correct {
    border-color: #3ea35a;
    background: #e4f6e9;
    color: #1f7a3d;
  }
  .quiz-choice-btn.wrong {
    border-color: var(--red);
    background: #fbe4e2;
    color: var(--red);
  }
  .quiz-feedback-text {
    text-align: center;
    margin-top: 14px;
    font-weight: bold;
    font-size: clamp(14px, 4vw, 16px);
  }
  .quiz-feedback-text.correct {
    color: #4ade80;
  }
  .quiz-feedback-text.wrong {
    color: var(--red);
  }
  .quiz-result-title {
    font-size: clamp(24px, 7vw, 30px);
    font-weight: 900;
    text-align: center;
    color: #fff;
    margin-bottom: 10px;
  }
  .quiz-result-bonus {
    font-size: clamp(18px, 5.5vw, 22px);
    font-weight: bold;
    text-align: center;
    color: var(--red);
    margin-bottom: 8px;
  }
  .quiz-result-perfect {
    text-align: center;
    font-size: clamp(15px, 4.5vw, 17px);
    font-weight: bold;
    color: var(--gold);
    margin-bottom: 14px;
  }
  .quiz-close-btn {
    display: block;
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    margin-top: 10px;
    padding: 12px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    font-weight: bold;
    font-size: clamp(15px, 4.5vw, 17px);
    cursor: pointer;
    touch-action: manipulation;
  }
  .quiz-close-btn:active {
    filter: brightness(0.9);
  }
  .badge-open-btn {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #6b4fa8, #3d2a63);
    color: #fff;
    font-family: inherit;
    font-weight: bold;
    font-size: clamp(14px, 4.2vw, 17px);
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  }
  .badge-open-btn:active {
    filter: brightness(0.92);
  }
  .badge-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 8, 14, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9980;
    padding: 20px;
  }
  .badge-overlay[hidden] {
    display: none;
  }
  .badge-card {
    background: var(--panel);
    border-radius: 20px;
    padding: 20px 18px;
    max-width: 380px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  .badge-card-title {
    font-size: clamp(17px, 5vw, 20px);
    font-weight: bold;
    color: #fff;
    text-align: center;
    margin-bottom: 14px;
  }
  .badge-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

    n = Math.floor(n);
    if (n >= 1000000) {
      return (n / 10000).toFixed(1) + '万';
    }
    return n.toLocaleString('en-US');
  }

  function priceFor(item) {
    return Math.ceil(item.basePrice * Math.pow(1.15, shopOwned[item.id]));
  }

    return SHOP_ITEMS.filter(i => i.type === 'tap').reduce((sum, i) => sum + i.value * shopOwned[i.id], 0);
  }

  function calcPerSecond() {
    return SHOP_ITEMS.filter(i => i.type === 'auto').reduce((sum, i) => sum + i.value * shopOwned[i.id], 0);
  }

  function stageForTotal(total) {
    let stage = 0;
    STAGE_THRESHOLDS.forEach((min, idx) => { if (total >= min) stage = idx; });

  }

      progressMax.hidden = true;
      const min = STAGE_THRESHOLDS[stageIdx];
      const max = STAGE_THRESHOLDS[stageIdx + 1];
      const pct = Math.max(0, Math.min(100, ((powerLifetime - min) / (max - min)) * 100));
      progressFill.style.width = pct + '%';
    }
    updatePowerPerSecondDisplay();
  }

  function refreshShopDisplay() {
    SHOP_ITEMS.forEach(item => {
      const price = priceFor(item);
      document.getElementById('owned-' + item.id).textContent = shopOwned[item.id];
      document.getElementById('price-' + item.id).textContent = formatNumber(price) + 'P';
      document.getElementById('buy-' + item.id).disabled = powerWallet < price;
    });
  }

  function buyItem(id) {
    const item = SHOP_ITEMS.find(i => i.id === id);
    const price = priceFor(item);
    if (powerWallet < price) return;
    powerWallet -= price;
    shopOwned[id] += 1;
    updateTopDisplay(currentStage);
    refreshShopDisplay();
    evaluateBadges();
    saveProgress();
  }

  function updateBodyStage() {
    const stageIdx = stageForTotal(powerLifetime);
    updateTopDisplay(stageIdx);
    if (stageIdx === currentStage) return;
    const previousStage = currentStage;
    currentStage = stageIdx;
    bodyImg.style.opacity = '0';
    setTimeout(() => {
      bodyImg.src = 'images/lv' + (stageIdx + 1) + '.png';
      bodyImg.style.opacity = '1';
      if (previousStage !== -1 && stageIdx > previousStage) {
        playLevelUpEffect(stageIdx);
      }
    }, 150);
  }

  const LEVELUP_RAY_COUNT = 8;
  for (let i = 0; i < LEVELUP_RAY_COUNT; i++) {
    const ray = document.createElement('div');
    ray.className = 'levelup-ray';
    ray.style.setProperty('--ray-angle', (i * (360 / LEVELUP_RAY_COUNT)) + 'deg');
    levelupRays.appendChild(ray);
  }

  function positionLevelupDim() {
    const rect = characterWrap.getBoundingClientRect();
    const xPct = ((rect.left + rect.width / 2) / window.innerWidth * 100).toFixed(1) + '%';
    const yPct = ((rect.top + rect.height / 2) / window.innerHeight * 100).toFixed(1) + '%';
    levelupDim.style.setProperty('--spot-x', xPct);
    levelupDim.style.setProperty('--spot-y', yPct);
  }

  function spawnLevelUpParticles() {
    levelupParticles.innerHTML = '';
    const count = 40;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      const isStar = Math.random() < 0.5;
      p.className = 'levelup-particle' + (isStar ? ' star' : '');
      if (isStar) p.textContent = '★';
      const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.5 - 0.25);
      const dist = 55 + Math.random() * 85;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist * 0.7;
      const fallDy = dy + 50 + Math.random() * 70;
      p.style.setProperty('--dx', dx.toFixed(1) + 'px');
      p.style.setProperty('--dy', dy.toFixed(1) + 'px');
      p.style.setProperty('--fall-dy', fallDy.toFixed(1) + 'px');
      p.style.animationDelay = (0.22 + Math.random() * 0.18).toFixed(2) + 's';
      levelupParticles.appendChild(p);
    }
    void levelupParticles.offsetWidth;
    levelupParticles.querySelectorAll('.levelup-particle').forEach(p => p.classList.add('show'));
  }

  function playLevelUpEffect(stageIdx) {
    clearTimeout(levelupTimer);
    levelupSub.textContent = TITLES[stageIdx] + ' に昇格！';

    [levelupDim, levelupTextOverlay, levelupGlow, levelupBurst, levelupRings, levelupRays, screenFlash].forEach(el => {
      el.classList.remove('show');
    });
    bodyImg.classList.remove('punch');
    void levelupTextOverlay.offsetWidth;

    positionLevelupDim();
    levelupDim.classList.add('show');
    levelupTextOverlay.classList.add('show');
    levelupGlow.classList.add('show');
    levelupBurst.classList.add('show');
    levelupRings.classList.add('show');
    levelupRays.classList.add('show');
    screenFlash.classList.add('show');
    bodyImg.classList.add('punch');
    spawnLevelUpParticles();

    levelupTimer = setTimeout(() => {
      [levelupDim, levelupTextOverlay, levelupGlow, levelupBurst, levelupRings, levelupRays, screenFlash].forEach(el => {
        el.classList.remove('show');
      });
      levelupParticles.innerHTML = '';
    }, 2000);
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pickChoiceKeys(correctKey) {
    const keys = Object.keys(parts);
    const wrongPool = shuffle(keys.filter(k => k !== correctKey));
    return shuffle([correctKey, ...wrongPool.slice(0, 3)]);
  }

  function buildQuizQuestions() {
    const keys = Object.keys(parts);
    const questions = [];
    for (let i = 0; i < QUIZ_QUESTION_COUNT; i++) {
      const key = keys[Math.floor(Math.random() * keys.length)];
      const type = Math.random() < 0.5 ? 'A' : 'B';
      const choiceKeys = pickChoiceKeys(key);
      const correctIndex = choiceKeys.indexOf(key);
      if (type === 'A') {
        questions.push({
          text: parts[key].name + 'は、どの部位の筋肉？',
          choices: choiceKeys.map(k => PART_LABELS[k]),
          correctIndex: correctIndex
        });
      } else {
        questions.push({
          text: PART_LABELS[key] + 'の筋肉の正式名称は？',
          choices: choiceKeys.map(k => parts[k].name),
          correctIndex: correctIndex
        });
      }
    }
    return questions;
  }

  function renderQuizQuestion() {
    quizAnswering = false;
    const q = quizQuestions[quizIndex];
    quizProgress.textContent = (quizIndex + 1) + '問目 / ' + QUIZ_QUESTION_COUNT + '問';
    quizQuestionEl.textContent = q.text;
    quizFeedbackText.hidden = true;
    quizChoicesEl.innerHTML = '';
    q.choices.forEach((label, idx) => {
      const btn = document.createElement('button');
      btn.className = 'quiz-choice-btn';
      btn.textContent = label;
      btn.addEventListener('click', () => handleQuizAnswer(idx, btn));
      quizChoicesEl.appendChild(btn);
    });
  }

  function handleQuizAnswer(idx, btnEl) {
    if (quizAnswering) return;
    quizAnswering = true;
    const q = quizQuestions[quizIndex];
    const buttons = Array.from(quizChoicesEl.children);
    buttons.forEach(b => { b.disabled = true; });
    if (idx === q.correctIndex) {
      btnEl.classList.add('correct');
      quizCorrectCount++;
      quizFeedbackText.textContent = '正解！';
      quizFeedbackText.className = 'quiz-feedback-text correct';
    } else {
      btnEl.classList.add('wrong');
      buttons[q.correctIndex].classList.add('correct');
      quizFeedbackText.textContent = '正解は ' + q.choices[q.correctIndex];
      quizFeedbackText.className = 'quiz-feedback-text wrong';
    }
    quizFeedbackText.hidden = false;
    quizAdvanceTimer = setTimeout(() => {
      quizIndex++;
      if (quizIndex < quizQuestions.length) {
        renderQuizQuestion();
      } else {
        showQuizResult();
      }
    }, QUIZ_ANSWER_DELAY);
  }

  function showQuizResult() {
    quizQuestionView.hidden = true;
    quizResultView.hidden = false;
    quizResultTitle.textContent = quizCorrectCount + '問正解！';
    let bonus = quizCorrectCount * QUIZ_CORRECT_BONUS;
    const perfect = quizCorrectCount === quizQuestions.length;
    if (perfect) bonus += QUIZ_PERFECT_BONUS;
    quizResultBonus.textContent = '＋' + formatNumber(bonus) + 'P 獲得';
    quizResultPerfect.hidden = !perfect;
    quizPendingBonus = bonus;
    quizBestCorrect = Math.max(quizBestCorrect, quizCorrectCount);
    evaluateBadges();
  }

  function openQuiz() {
    quizQuestions = buildQuizQuestions();
    quizIndex = 0;
    quizCorrectCount = 0;
    quizPendingBonus = 0;
    quizQuestionView.hidden = false;
    quizResultView.hidden = true;
    quizOverlay.hidden = false;
    renderQuizQuestion();
  }

  function closeQuiz() {
    clearTimeout(quizAdvanceTimer);
    const bonus = quizPendingBonus;
    quizPendingBonus = 0;
    quizOverlay.hidden = true;
    if (bonus > 0) {
      powerWallet += bonus;
      powerLifetime += bonus;
      updateBodyStage();
      refreshShopDisplay();
      saveProgress();
    }
  }

  function saveProgress() {
    const data = {};
    Object.keys(parts).forEach(key => { data[key] = parts[key].count; });
    data.powerWallet = powerWallet;
    data.powerLifetime = powerLifetime;
    data.shopOwned = shopOwned;
    data.lastActiveAt = Date.now();
    data.streakDays = streakDays;
    data.lastBonusDate = lastBonusDate;
    data.earnedBadges = earnedBadges;
    data.quizBestCorrect = quizBestCorrect;
    data.offlineClaimCount = offlineClaimCount;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function loadProgress() {
    let saved;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { saved = null; }
    if (!saved) return;
    Object.keys(parts).forEach(key => {
      if (typeof saved[key] === 'number' && saved[key] > 0) {
        parts[key].count = saved[key];
        document.getElementById('count-' + key).textContent = saved[key] + '回';
      }
    });
    const tapTotal = Object.keys(parts).reduce((sum, key) => sum + parts[key].count, 0);
    powerLifetime = typeof saved.powerLifetime === 'number' ? saved.powerLifetime : tapTotal;
    powerWallet = typeof saved.powerWallet === 'number' ? saved.powerWallet : powerLifetime;
    if (saved.shopOwned) {
      Object.keys(shopOwned).forEach(id => {
        if (typeof saved.shopOwned[id] === 'number' && saved.shopOwned[id] > 0) {
          shopOwned[id] = saved.shopOwned[id];
        }
      });
    }
    lastActiveAt = typeof saved.lastActiveAt === 'number' ? saved.lastActiveAt : null;
    streakDays = typeof saved.streakDays === 'number' ? saved.streakDays : 0;
    lastBonusDate = typeof saved.lastBonusDate === 'string' ? saved.lastBonusDate : null;
    earnedBadges = Array.isArray(saved.earnedBadges) ? saved.earnedBadges : [];
    quizBestCorrect = typeof saved.quizBestCorrect === 'number' ? saved.quizBestCorrect : 0;
    offlineClaimCount = typeof saved.offlineClaimCount === 'number' ? saved.offlineClaimCount : 0;
    if (tapTotal > 0) {
      infoName.textContent = 'おかえりなさい！';
      infoDesc.textContent = 'ここまで育てたマッチョです。続きを鍛えましょう';
    }
  }

  function checkOfflineReward() {
    const ps = calcPerSecond();
    if (ps <= 0 || !lastActiveAt) return;
    const elapsedSec = Math.floor((Date.now() - lastActiveAt) / 1000);
    if (elapsedSec < OFFLINE_MIN_SECONDS) return;
    const cappedSec = Math.min(elapsedSec, OFFLINE_CAP_SECONDS);
    const earned = ps * cappedSec;
    if (earned <= 0) return;
    pendingOfflineReward = { amount: earned };
    const hours = Math.floor(cappedSec / 3600);
    const minutes = Math.floor((cappedSec % 3600) / 60);
    offlineBannerText.textContent = 'おかえり！ ' + hours + '時間' + minutes + '分のトレーニングで ＋' + formatNumber(earned) + 'P';
    offlineBanner.hidden = false;
  }

  function claimOfflineReward() {
    if (!pendingOfflineReward) return;
    const bonus = pendingOfflineReward.amount;
    pendingOfflineReward = null;
    offlineBanner.classList.add('hide');
    setTimeout(() => {
      offlineBanner.hidden = true;
      offlineBanner.classList.remove('hide');
    }, 300);
    powerWallet += bonus;
    powerLifetime += bonus;
    offlineClaimCount++;
    updateBodyStage();
    refreshShopDisplay();
    evaluateBadges();
    saveProgress();
  }

  function dateString(d) {
    const y = d.getFullYear();
    const m = ('0' + (d.getMonth() + 1)).slice(-2);
    const day = ('0' + d.getDate()).slice(-2);
    return y + '-' + m + '-' + day;
  }

  function checkDailyBonus() {
    const today = dateString(new Date());
    if (lastBonusDate === today) return;
    let newStreak;
    if (lastBonusDate) {
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      newStreak = (lastBonusDate === dateString(yesterday)) ? streakDays + 1 : 1;
    } else {
      newStreak = 1;
    }
    const amount = DAILY_BONUS_AMOUNTS[Math.min(newStreak, DAILY_BONUS_AMOUNTS.length) - 1];
    pendingDailyBonus = { day: newStreak, amount: amount };
    dailyBannerText.textContent = 'ログインボーナス ' + newStreak + '日目！ ＋' + formatNumber(amount) + 'P';
    dailyBanner.hidden = false;
  }

  function claimDailyBonus() {
    if (!pendingDailyBonus) return;
    const bonus = pendingDailyBonus.amount;
    streakDays = pendingDailyBonus.day;
    lastBonusDate = dateString(new Date());
    pendingDailyBonus = null;
    dailyBanner.classList.add('hide');
    setTimeout(() => {
      dailyBanner.hidden = true;
      dailyBanner.classList.remove('hide');
    }, 300);
    powerWallet += bonus;
    powerLifetime += bonus;
    updateBodyStage();
    refreshShopDisplay();
    evaluateBadges();
    saveProgress();
  }

  function updateBadgeButtonLabel() {
    badgeOpenBtn.textContent = '実績バッジ（' + earnedBadges.length + '/12）';
  }

  function queueBadgeToast(badge) {
    badgeToastQueue.push(badge);
    if (!badgeToastTimer) showNextBadgeToast();
  }

  function showNextBadgeToast() {
    if (badgeToastQueue.length === 0) { badgeToastTimer = null; return; }
    const badge = badgeToastQueue.shift();
    badgeToastText.textContent = '実績解除！ ' + badge.name;
    badgeToast.classList.remove('hide');
    badgeToast.hidden = false;
    badgeToastTimer = setTimeout(() => {
      badgeToast.classList.add('hide');
      setTimeout(() => {
        badgeToast.hidden = true;
        badgeToast.classList.remove('hide');
        badgeToastTimer = null;
        showNextBadgeToast();
      }, 300);
    }, 3000);
  }

  function evaluateBadges() {
    const tapTotal = Object.keys(parts).reduce((sum, k) => sum + parts[k].count, 0);
    const shopTotal = Object.keys(shopOwned).reduce((sum, k) => sum + shopOwned[k], 0);
    const allPartsOver100 = Object.keys(parts).every(k => parts[k].count >= 100);
    const conditions = {
      first_tap: tapTotal >= 1,
      tap100: tapTotal >= 100,
      tap1000: tapTotal >= 1000,
      gym_first: shopTotal >= 1,
      gym10: shopTotal >= 10,
      belt: shopOwned.belt >= 1,
      quiz4: quizBestCorrect >= 4,
      quizperfect: quizBestCorrect >= 5,
      maxstage: currentStage >= 5,
      streak7: streakDays >= 7,
      offline1: offlineClaimCount >= 1,
      balance100: allPartsOver100
    };
    let changed = false;
    BADGES.forEach(b => {
      if (conditions[b.id] && !earnedBadges.includes(b.id)) {
        earnedBadges.push(b.id);
        queueBadgeToast(b);
        changed = true;
      }
    });
    if (changed) {
      updateBadgeButtonLabel();
      if (!badgeOverlay.hidden) renderBadgeGrid();
      saveProgress();
    }
  }

  function renderBadgeGrid() {
    badgeGrid.innerHTML = '';
    BADGES.forEach(b => {
      const unlocked = earnedBadges.includes(b.id);
      const cell = document.createElement('button');
      cell.className = 'badge-cell ' + (unlocked ? 'unlocked' : 'locked');
      cell.innerHTML =
        '<div class="badge-icon-circle">' + (unlocked ? b.icon : '？') + '</div>' +
        '<div class="badge-cell-name">' + b.name + '</div>' +
        (unlocked ? '' : '<div class="badge-cell-cond">' + b.desc + '</div>');
      cell.addEventListener('click', () => {
        badgeDetailName.textContent = b.name + (unlocked ? '（獲得済み）' : '（未獲得）');
        badgeDetailDesc.textContent = '達成条件：' + b.desc;
        badgeDetail.hidden = false;
      });
      badgeGrid.appendChild(cell);
    });
  }

  function openBadges() {
    badgeDetail.hidden = true;
    renderBadgeGrid();
    badgeOverlay.hidden = false;
  }

  function closeBadges() {
    badgeOverlay.hidden = true;
  }

  document.querySelectorAll('.part-status').forEach(zone => {
    zone.addEventListener('click', () => {
      const part = zone.dataset.part;
      const p = parts[part];
      p.count += 1;
      document.getElementById('count-' + part).textContent = p.count + '回';
      infoName.textContent = p.name;
      infoDesc.textContent = p.desc;
      const gain = 1 + calcTapBonus();
      powerWallet += gain;
      powerLifetime += gain;
      spawnPartGlow(part);
      triggerCharacterWobble();
      updateBodyStage();
      refreshShopDisplay();
      evaluateBadges();
      saveProgress();
    });
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (!window.confirm('本当に最初からやり直しますか？')) return;
    Object.keys(parts).forEach(key => {
      parts[key].count = 0;
      document.getElementById('count-' + key).textContent = '0回';
    });
    powerWallet = 0;
    powerLifetime = 0;
    Object.keys(shopOwned).forEach(id => { shopOwned[id] = 0; });
    lastActiveAt = null;
    pendingOfflineReward = null;
    offlineBanner.hidden = true;
    offlineBanner.classList.remove('hide');
    streakDays = 0;
    lastBonusDate = null;
    pendingDailyBonus = null;
    dailyBanner.hidden = true;
    dailyBanner.classList.remove('hide');
    earnedBadges = [];
    quizBestCorrect = 0;
    offlineClaimCount = 0;
    badgeToastQueue = [];
    clearTimeout(badgeToastTimer);
    badgeToastTimer = null;
    badgeToast.hidden = true;
    badgeToast.classList.remove('hide');
    badgeOverlay.hidden = true;
    updateBadgeButtonLabel();
    infoName.textContent = 'さあ、鍛えよう！';
    infoDesc.textContent = 'キャラクターの体（胸・腕・脚・肩・背中・腹）をタップして筋トレを始めましょう';
    updateBodyStage();
    refreshShopDisplay();
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  });

  offlineBannerBtn.addEventListener('click', claimOfflineReward);
  dailyBannerBtn.addEventListener('click', claimDailyBonus);

  window.addEventListener('pagehide', saveProgress);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') saveProgress();
  });

  SHOP_ITEMS.forEach(item => {
    const div = document.createElement('div');
    div.className = 'shop-item';
    div.innerHTML =
      '<div class="shop-item-info">' +
        '<div class="shop-item-name">' + item.name + '</div>' +
        '<div class="shop-item-desc">' + item.desc + '</div>' +
        '<div class="shop-item-owned">所持数: <span class="owned-val" id="owned-' + item.id + '">0</span></div>' +
      '</div>' +
      '<button class="shop-buy-btn" id="buy-' + item.id + '" data-id="' + item.id + '">' +
        '<span class="price-val" id="price-' + item.id + '">' + formatNumber(item.basePrice) + 'P</span>' +
        '<span class="buy-label">買う</span>' +
      '</button>';
    shopListEl.appendChild(div);
  });

  shopListEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.shop-buy-btn');
    if (!btn || btn.disabled) return;
    buyItem(btn.dataset.id);
  });

  quizOpenBtn.addEventListener('click', openQuiz);
  quizCloseBtn.addEventListener('click', closeQuiz);
  badgeOpenBtn.addEventListener('click', openBadges);
  badgeCloseBtn.addEventListener('click', closeBadges);

  setInterval(() => {
    const ps = calcPerSecond();
    if (ps <= 0) return;
    powerWallet += ps;
    powerLifetime += ps;
    updateBodyStage();
    refreshShopDisplay();
    saveProgress();
  }, 1000);

  loadProgress();
  currentStage = stageForTotal(powerLifetime);
  bodyImg.src = 'images/lv' + (currentStage + 1) + '.png';
  updateTopDisplay(currentStage);
  refreshShopDisplay();
  updateBadgeButtonLabel();
  evaluateBadges();
  checkOfflineReward();
  checkDailyBonus();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>マッチョ育成ゲーム</title>
<style>
  :root {
    color-scheme: light;
    --bg-top: #fff2e0;
    --bg-bottom: #ffd9a8;
    --skin: #f2b980;
    --skin-shade: #d99b5f;
    --accent: #ff6b35;
    --accent-dark: #e0501d;
    --ink: #3a2a1a;
    --panel: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: var(--ink);
  }
  body {
    display: flex;
    justify-content: center;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    min-height: 100vh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .app {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 16px 16px 24px;
  }
  h1 {
    text-align: center;
    font-size: clamp(20px, 5vw, 28px);
    margin: 4px 0 12px;
    letter-spacing: 0.05em;
  }
  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 260px;
    padding: 12px 0;
  }
  .character {
    position: relative;
    width: 220px;
    height: 260px;
  }
  .head {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--skin);
    border: 3px solid var(--skin-shade);
    z-index: 3;
  }
  .body-part {
    -webkit-appearance: none;
    appearance: none;
    margin: 0;
    padding: 0;
    font: inherit;
    cursor: pointer;
    outline: none;
    touch-action: manipulation;
  }
  .body-part:active {
    filter: brightness(0.88);
  }
  .torso {
    position: absolute;
    top: 52px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 100px;
    border-radius: 24px 24px 30px 30px;
    background: var(--skin);
    border: 3px solid var(--skin-shade);
    transition: width 0.25s ease;
    z-index: 1;
  }
  .arm {
    position: absolute;
    top: 62px;
    width: 24px;
    height: 90px;
    border-radius: 14px;
    background: var(--skin);
    border: 3px solid var(--skin-shade);
    transition: width 0.25s ease, transform 0.25s ease;
    z-index: 1;
  }
  .arm-left { left: 50%; transform: translateX(calc(-45px - 100%)); transform-origin: top center; }
  .arm-right { left: 50%; transform: translateX(45px); transform-origin: top center; }
  .shoulder {
    position: absolute;
    top: 50px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--skin);
    border: 3px solid var(--skin-shade);
    transition: width 0.25s ease, height 0.25s ease;
    z-index: 2;
  }
  .shoulder-left { left: 50%; transform: translateX(-65px); }
  .shoulder-right { left: 50%; transform: translateX(33px); }
  .back {
    position: absolute;
    top: 150px;
    width: 22px;
    height: 50px;
    border-radius: 10px;
    background: var(--skin);
    border: 3px solid var(--skin-shade);
    transition: width 0.25s ease;
    z-index: 0;
  }
  .back-left { left: 50%; transform: translateX(calc(-45px - 100%)); }
  .back-right { left: 50%; transform: translateX(45px); }
  .leg {
    position: absolute;
    top: 148px;
    width: 32px;
    height: 100px;
    border-radius: 0 0 16px 16px;
    background: var(--skin);
    border: 3px solid var(--skin-shade);
    transition: width 0.25s ease;
    z-index: 1;
  }
  .leg-left { left: 50%; transform: translateX(-38px); }
  .leg-right { left: 50%; transform: translateX(6px); }
  .info {
    background: var(--panel);
    border-radius: 16px;
    padding: 14px 16px;
    margin: 0 0 14px;
    min-height: 64px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .info .name {
    font-size: clamp(17px, 4.5vw, 20px);
    font-weight: bold;
    color: var(--accent-dark);
  }
  .info .desc {
    font-size: clamp(14px, 3.8vw, 16px);
    line-height: 1.4;
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px 10px;
  }
  .part-status {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 6px;
    border-radius: 18px;
    background: var(--accent);
    color: #fff;
  }
  .btn-label {
    font-size: clamp(18px, 5vw, 22px);
    font-weight: bold;
  }
  .btn-count {
    font-size: clamp(13px, 3.5vw, 15px);
    opacity: 0.9;
  }
  .reset-wrap {
    display: flex;
    justify-content: center;
    margin-top: 22px;
  }
  .reset-btn {
    -webkit-appearance: none;
    appearance: none;
    padding: 8px 20px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--skin-shade);
    border-radius: 999px;
    opacity: 0.6;
    touch-action: manipulation;
  }
  .reset-btn:active {
    opacity: 1;
  }
  @media (max-height: 640px) {
    .character { width: 180px; height: 210px; }
    .stage { min-height: 200px; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>マッチョ育成ゲーム</h1>
  <div class="stage">
    <div class="character">
      <div class="head"></div>
      <button class="body-part shoulder shoulder-left" id="part-shoulder-left" data-part="shoulder" aria-label="肩をタップして鍛える"></button>
      <button class="body-part shoulder shoulder-right" id="part-shoulder-right" data-part="shoulder" aria-label="肩をタップして鍛える"></button>
      <button class="body-part torso" id="part-chest" data-part="chest" aria-label="胸をタップして鍛える"></button>
      <button class="body-part back back-left" id="part-back-left" data-part="back" aria-label="背中をタップして鍛える"></button>
      <button class="body-part back back-right" id="part-back-right" data-part="back" aria-label="背中をタップして鍛える"></button>
      <button class="body-part arm arm-left" id="part-arm-left" data-part="arm" aria-label="腕をタップして鍛える"></button>
      <button class="body-part arm arm-right" id="part-arm-right" data-part="arm" aria-label="腕をタップして鍛える"></button>
      <button class="body-part leg leg-left" id="part-leg-left" data-part="leg" aria-label="脚をタップして鍛える"></button>
      <button class="body-part leg leg-right" id="part-leg-right" data-part="leg" aria-label="脚をタップして鍛える"></button>
    </div>
  </div>
  <div class="info" id="info">
    <div class="name">さあ、鍛えよう！</div>
    <div class="desc">キャラクターの体（胸・腕・脚・肩・背中）をタップして筋トレを始めましょう</div>
  </div>
  <div class="controls">
    <div class="part-status">
      <span class="btn-label">胸</span>
      <span class="btn-count" id="count-chest">0回</span>
    </div>
    <div class="part-status">
      <span class="btn-label">腕</span>
      <span class="btn-count" id="count-arm">0回</span>
    </div>
    <div class="part-status">
      <span class="btn-label">脚</span>
      <span class="btn-count" id="count-leg">0回</span>
    </div>
    <div class="part-status">
      <span class="btn-label">肩</span>
      <span class="btn-count" id="count-shoulder">0回</span>
    </div>
    <div class="part-status">
      <span class="btn-label">背中</span>
      <span class="btn-count" id="count-back">0回</span>
    </div>
  </div>
  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">最初から</button>
  </div>
</div>
<script>
  const parts = {
    chest: {
      name: '大胸筋',
      desc: '胸の中心を覆う大きな筋肉。押す動作で使われます。',
      els: [document.getElementById('part-chest')],
      baseWidth: 90,
      maxAdd: 46,
      count: 0
    },
    arm: {
      name: '上腕二頭筋',
      desc: '腕の力こぶ。ものを持ち上げる動作で使われます。',
      els: [document.getElementById('part-arm-left'), document.getElementById('part-arm-right')],
      baseWidth: 24,
      maxAdd: 20,
      count: 0
    },
    leg: {
      name: '大腿四頭筋',
      desc: '太ももの前側の筋肉。歩く・走るときに使われます。',
      els: [document.getElementById('part-leg-left'), document.getElementById('part-leg-right')],
      baseWidth: 32,
      maxAdd: 22,
      count: 0
    },
    shoulder: {
      name: '三角筋',
      desc: '肩を丸く覆う筋肉。腕を横に上げる動作で使われます。',
      els: [document.getElementById('part-shoulder-left'), document.getElementById('part-shoulder-right')],
      baseWidth: 32,
      maxAdd: 14,
      growHeight: true,
      count: 0
    },
    back: {
      name: '広背筋',
      desc: '背中を大きく広げる筋肉。逆三角形の体型を作ります。',
      els: [document.getElementById('part-back-left'), document.getElementById('part-back-right')],
      baseWidth: 22,
      maxAdd: 20,
      count: 0
    }
  };

  const infoName = document.querySelector('#info .name');
  const infoDesc = document.querySelector('#info .desc');
  const STEP = 3;
  const TAPS_TO_MAX = 15;
  const STORAGE_KEY = 'macho-game-progress';

  function applyGrowth(part) {
    const p = parts[part];
    const growth = Math.min(p.count, TAPS_TO_MAX) / TAPS_TO_MAX;
    const width = p.baseWidth + p.maxAdd * growth;
    p.els.forEach(el => {
      el.style.width = width + 'px';
      if (p.growHeight) el.style.height = width + 'px';
    });
  }

  function saveProgress() {
    const data = {};
    Object.keys(parts).forEach(key => { data[key] = parts[key].count; });
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function loadProgress() {
    let saved;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { saved = null; }
    if (!saved) return;
    Object.keys(parts).forEach(key => {
      if (typeof saved[key] === 'number' && saved[key] > 0) {
        parts[key].count = saved[key];
        document.getElementById('count-' + key).textContent = saved[key] + '回';
        applyGrowth(key);
      }
    });
    const total = Object.keys(parts).reduce((sum, key) => sum + parts[key].count, 0);
    if (total > 0) {
      infoName.textContent = 'おかえりなさい！';
      infoDesc.textContent = 'ここまで育てたマッチョです。続きを鍛えましょう';
    }
  }

  document.querySelectorAll('.body-part').forEach(btn => {
    btn.addEventListener('click', () => {
      const part = btn.dataset.part;
      const p = parts[part];
      p.count += 1;
      document.getElementById('count-' + part).textContent = p.count + '回';
      applyGrowth(part);
      infoName.textContent = p.name;
      infoDesc.textContent = p.desc;
      saveProgress();
    });
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (!window.confirm('本当に最初からやり直しますか？')) return;
    Object.keys(parts).forEach(key => {
      parts[key].count = 0;
      document.getElementById('count-' + key).textContent = '0回';
      applyGrowth(key);
    });
    infoName.textContent = 'さあ、鍛えよう！';
    infoDesc.textContent = 'キャラクターの体（胸・腕・脚・肩・背中）をタップして筋トレを始めましょう';
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  });

  loadProgress();
</script>
</body>
</html>

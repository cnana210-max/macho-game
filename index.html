<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>マッチョ育成ゲーム</title>
<style>
  :root {
    color-scheme: light;
    --bg-top: #fff2e0;
    --bg-bottom: #ffd9a8;
    --skin: #e8b98a;
    --skin-shade: #d1985f;
    --accent: #ff6b35;
    --accent-dark: #e0501d;
    --ink: #3a2a1a;
    --panel: #ffffff;
    --red: #e23b2e;
    --gold: #f5c518;
    --teal: #3e8e8a;
    --outline: #1c1a17;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: var(--ink);
  }
  body {
    display: flex;
    justify-content: center;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    min-height: 100vh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .app {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 16px 16px 24px;
  }
  h1 {
    text-align: center;
    font-size: clamp(20px, 5vw, 28px);
    margin: 4px 0 12px;
    letter-spacing: 0.05em;
  }
  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 300px;
    padding: 12px 0;
  }
  .character {
    width: 220px;
    height: 300px;
    overflow: visible;
  }
  .outlined {
    stroke: var(--outline);
    stroke-width: 5;
    stroke-linejoin: round;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
  .body-silhouette {
    fill: var(--skin);
    transition: d 0.3s ease;
  }
  .detail-line {
    stroke: var(--outline);
    stroke-width: 2.5;
    stroke-linecap: round;
    fill: none;
    opacity: 0.55;
  }
  .tap-zone {
    fill: transparent;
    cursor: pointer;
    touch-action: manipulation;
    pointer-events: all;
  }
  .tap-zone:active ~ .body-silhouette { filter: brightness(0.97); }
  .info {
    background: var(--panel);
    border-radius: 16px;
    padding: 14px 16px;
    margin: 0 0 14px;
    min-height: 64px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .info .name {
    font-size: clamp(17px, 4.5vw, 20px);
    font-weight: bold;
    color: var(--accent-dark);
  }
  .info .desc {
    font-size: clamp(14px, 3.8vw, 16px);
    line-height: 1.4;
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px 10px;
  }
  .part-status {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 6px;
    border-radius: 18px;
    background: var(--accent);
    color: #fff;
  }
  .btn-label {
    font-size: clamp(18px, 5vw, 22px);
    font-weight: bold;
  }
  .btn-count {
    font-size: clamp(13px, 3.5vw, 15px);
    opacity: 0.9;
  }
  .reset-wrap {
    display: flex;
    justify-content: center;
    margin-top: 22px;
  }
  .reset-btn {
    -webkit-appearance: none;
    appearance: none;
    padding: 8px 20px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--skin-shade);
    border-radius: 999px;
    opacity: 0.6;
    touch-action: manipulation;
  }
  .reset-btn:active {
    opacity: 1;
  }
  @media (max-height: 640px) {
    .character { width: 165px; height: 225px; }
    .stage { min-height: 225px; padding: 6px 0 12px; }
    h1 { margin: 2px 0 8px; }
    .info { padding: 10px 14px; min-height: 52px; margin-bottom: 10px; }
    .reset-wrap { margin-top: 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>マッチョ育成ゲーム</h1>
  <div class="stage">
    <svg class="character" viewBox="0 0 220 300" xmlns="http://www.w3.org/2000/svg">
      <rect x="97" y="48" width="26" height="18" fill="var(--skin)" />

      <path id="bodySilhouette" class="body-silhouette outlined" d="" />

      <path class="detail-line" d="M110,66 L110,94" />
      <path class="detail-line" d="M100,128 L120,128" />
      <path class="detail-line" d="M100,138 L120,138" />
      <path class="detail-line" d="M100,148 L120,148" />

      <rect x="74" y="163" width="72" height="26" rx="12" fill="var(--red)" class="outlined" pointer-events="none" />
      <rect x="74" y="163" width="72" height="10" rx="5" fill="var(--gold)" class="outlined" pointer-events="none" />

      <rect x="72" y="222" width="34" height="50" rx="10" fill="var(--red)" class="outlined" pointer-events="none" />
      <rect x="72" y="222" width="34" height="10" rx="5" fill="var(--gold)" class="outlined" pointer-events="none" />
      <rect x="114" y="222" width="34" height="50" rx="10" fill="var(--red)" class="outlined" pointer-events="none" />
      <rect x="114" y="222" width="34" height="10" rx="5" fill="var(--gold)" class="outlined" pointer-events="none" />

      <rect x="40" y="148" width="26" height="12" rx="5" fill="var(--teal)" class="outlined" pointer-events="none" />
      <rect x="154" y="148" width="26" height="12" rx="5" fill="var(--teal)" class="outlined" pointer-events="none" />

      <rect x="107" y="8" width="6" height="32" rx="3" fill="var(--gold)" pointer-events="none" />
      <ellipse cx="110" cy="34" rx="27" ry="26" fill="var(--red)" class="outlined" pointer-events="none" />

      <ellipse cx="95" cy="32" rx="8" ry="6" fill="var(--gold)" class="outlined" pointer-events="none" />
      <ellipse cx="125" cy="32" rx="8" ry="6" fill="var(--gold)" class="outlined" pointer-events="none" />
      <circle cx="95" cy="32" r="3.5" fill="#fff" pointer-events="none" />
      <circle cx="125" cy="32" r="3.5" fill="#fff" pointer-events="none" />

      <path d="M99,45 C99,50 104,54 110,54 C116,54 121,50 121,45 C121,52 116,58 110,58 C104,58 99,52 99,45 Z"
        fill="var(--gold)" class="outlined" pointer-events="none" />
      <ellipse cx="110" cy="49" rx="5.5" ry="2.5" fill="var(--outline)" pointer-events="none" />

      <rect class="tap-zone" data-part="shoulder" x="38" y="50" width="47" height="42" />
      <rect class="tap-zone" data-part="shoulder" x="135" y="50" width="47" height="42" />
      <rect class="tap-zone" data-part="chest" x="90" y="58" width="40" height="57" />
      <rect class="tap-zone" data-part="back" x="75" y="95" width="10" height="73" />
      <rect class="tap-zone" data-part="back" x="135" y="95" width="10" height="73" />
      <rect class="tap-zone" data-part="arm" x="28" y="90" width="47" height="76" />
      <rect class="tap-zone" data-part="arm" x="145" y="90" width="47" height="76" />
      <rect class="tap-zone" data-part="abs" x="85" y="115" width="50" height="53" />
      <rect class="tap-zone" data-part="leg" x="58" y="168" width="52" height="100" />
      <rect class="tap-zone" data-part="leg" x="110" y="168" width="52" height="100" />
    </svg>
  </div>
  <div class="info" id="info">
    <div class="name">さあ、鍛えよう！</div>
    <div class="desc">キャラクターの体（胸・腕・脚・肩・背中・腹）をタップして筋トレを始めましょう</div>
  </div>
  <div class="controls">
    <div class="part-status">
      <span class="btn-label">胸</span>
      <span class="btn-count" id="count-chest">0回</span>
    </div>
    <div class="part-status">
      <span class="btn-label">腕</span>
      <span class="btn-count" id="count-arm">0回</span>
    </div>
    <div class="part-status">
      <span class="btn-label">脚</span>
      <span class="btn-count" id="count-leg">0回</span>
    </div>
    <div class="part-status">
      <span class="btn-label">肩</span>
      <span class="btn-count" id="count-shoulder">0回</span>
    </div>
    <div class="part-status">
      <span class="btn-label">背中</span>
      <span class="btn-count" id="count-back">0回</span>
    </div>
    <div class="part-status">
      <span class="btn-label">腹</span>
      <span class="btn-count" id="count-abs">0回</span>
    </div>
  </div>
  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">最初から</button>
  </div>
</div>
<script>
  const parts = {
    chest: { name: '大胸筋', desc: '胸の中心を覆う大きな筋肉。押す動作で使われます。', count: 0 },
    arm: { name: '上腕二頭筋', desc: '腕の力こぶ。ものを持ち上げる動作で使われます。', count: 0 },
    leg: { name: '大腿四頭筋', desc: '太ももの前側の筋肉。歩く・走るときに使われます。', count: 0 },
    shoulder: { name: '三角筋', desc: '肩を丸く覆う筋肉。腕を横に上げる動作で使われます。', count: 0 },
    back: { name: '広背筋', desc: '背中を大きく広げる筋肉。逆三角形の体型を作ります。', count: 0 },
    abs: { name: '腹直筋', desc: 'お腹の中心を縦に走る筋肉。腹筋運動で鍛えられます。', count: 0 }
  };

  const infoName = document.querySelector('#info .name');
  const infoDesc = document.querySelector('#info .desc');
  const bodyEl = document.getElementById('bodySilhouette');
  const STORAGE_KEY = 'macho-game-progress';
  const STAGE_THRESHOLDS = [0, 10, 30, 60, 100];

  function buildBodyPath(p) {
    const L = (h) => (110 - h).toFixed(1);
    const R = (h) => (110 + h).toFixed(1);
    return [
      'M', L(14), ',52',
      ' C', L(20), ',58 ', L(26), ',58 ', L(p.shoulder), ',62',
      ' C', L(p.armOuter - 6), ',90 ', L(p.armOuter - 2), ',120 ', L(p.armOuter), ',150',
      ' L', L(p.hand), ',158',
      ' C', L(p.armpit + 8), ',145 ', L(p.armpit + 3), ',125 ', L(p.armpit), ',110',
      ' C', L(p.waist - 2), ',130 ', L(p.waist - 1), ',150 ', L(p.waist), ',168',
      ' C', L(p.legOuter + 1), ',200 ', L(p.legOuter + 0.5), ',230 ', L(p.legOuter), ',262',
      ' L', L(p.foot), ',268',
      ' C', L(p.crotch + 3), ',230 ', L(p.crotch + 1), ',200 ', L(p.crotch), ',180',
      ' L', R(p.crotch), ',180',
      ' C', R(p.crotch + 1), ',200 ', R(p.crotch + 3), ',230 ', R(p.foot), ',268',
      ' L', R(p.legOuter), ',262',
      ' C', R(p.legOuter + 0.5), ',230 ', R(p.legOuter + 1), ',200 ', R(p.waist), ',168',
      ' C', R(p.waist - 1), ',150 ', R(p.waist - 2), ',130 ', R(p.armpit), ',110',
      ' C', R(p.armpit + 3), ',125 ', R(p.armpit + 8), ',145 ', R(p.hand), ',158',
      ' L', R(p.armOuter), ',150',
      ' C', R(p.armOuter - 2), ',120 ', R(p.armOuter - 6), ',90 ', R(p.shoulder), ',62',
      ' C', R(26), ',58 ', R(20), ',58 ', R(14), ',52',
      ' Z'
    ].join('');
  }

  const SLIM = { shoulder: 34, armOuter: 36, hand: 30, armpit: 14, waist: 26, legOuter: 20, foot: 24, crotch: 8 };
  const BUFF = { shoulder: 60, armOuter: 70, hand: 48, armpit: 34, waist: 44, legOuter: 34, foot: 38, crotch: 8 };

  function lerpParams(t) {
    const out = {};
    Object.keys(SLIM).forEach(k => { out[k] = SLIM[k] + (BUFF[k] - SLIM[k]) * t; });
    return out;
  }

  const STAGE_PATHS = [0, 0.25, 0.5, 0.75, 1].map(t => buildBodyPath(lerpParams(t)));

  function stageForTotal(total) {
    let stage = 0;
    STAGE_THRESHOLDS.forEach((min, idx) => { if (total >= min) stage = idx; });
    return stage;
  }

  function updateBodyStage() {
    const total = Object.keys(parts).reduce((sum, key) => sum + parts[key].count, 0);
    const stageIdx = stageForTotal(total);
    bodyEl.style.d = 'path("' + STAGE_PATHS[stageIdx] + '")';
  }

  function saveProgress() {
    const data = {};
    Object.keys(parts).forEach(key => { data[key] = parts[key].count; });
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function loadProgress() {
    let saved;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { saved = null; }
    if (!saved) return;
    Object.keys(parts).forEach(key => {
      if (typeof saved[key] === 'number' && saved[key] > 0) {
        parts[key].count = saved[key];
        document.getElementById('count-' + key).textContent = saved[key] + '回';
      }
    });
    const total = Object.keys(parts).reduce((sum, key) => sum + parts[key].count, 0);
    if (total > 0) {
      infoName.textContent = 'おかえりなさい！';
      infoDesc.textContent = 'ここまで育てたマッチョです。続きを鍛えましょう';
    }
  }

  document.querySelectorAll('.tap-zone').forEach(zone => {
    zone.addEventListener('click', () => {
      const part = zone.dataset.part;
      const p = parts[part];
      p.count += 1;
      document.getElementById('count-' + part).textContent = p.count + '回';
      infoName.textContent = p.name;
      infoDesc.textContent = p.desc;
      updateBodyStage();
      saveProgress();
    });
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (!window.confirm('本当に最初からやり直しますか？')) return;
    Object.keys(parts).forEach(key => {
      parts[key].count = 0;
      document.getElementById('count-' + key).textContent = '0回';
    });
    infoName.textContent = 'さあ、鍛えよう！';
    infoDesc.textContent = 'キャラクターの体（胸・腕・脚・肩・背中・腹）をタップして筋トレを始めましょう';
    updateBodyStage();
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  });

  loadProgress();
  bodyEl.setAttribute('d', STAGE_PATHS[stageForTotal(Object.keys(parts).reduce((s, k) => s + parts[k].count, 0))]);
</script>
</body>
</html>

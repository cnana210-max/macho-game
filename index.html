<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>マッチョ育成ゲーム</title>
<style>
  :root {
    color-scheme: light;
    --bg-top: #fff2e0;
    --bg-bottom: #ffd9a8;
    --skin: #e8b98a;
    --skin-shade: #d1985f;
    --accent: #ff6b35;
    --accent-dark: #e0501d;
    --ink: #3a2a1a;
    --panel: #ffffff;
    --red: #e23b2e;
    --gold: #f5c518;
    --blue: #2b5fa8;
    --white: #ffffff;
    --outline: #3a2419;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: var(--ink);
  }
  body {
    display: flex;
    justify-content: center;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    min-height: 100vh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .app {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 16px 16px 24px;
  }
  h1 {
    text-align: center;
    font-size: clamp(20px, 5vw, 28px);
    margin: 4px 0 12px;
    letter-spacing: 0.05em;
  }
  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 300px;
    padding: 12px 0;
  }
  .character-img {
    display: block;
    width: auto;
    height: 100%;
    max-height: 300px;
    max-width: 100%;
    object-fit: contain;
    transition: opacity 0.3s ease;
  }
  .info {
    background: var(--panel);
    border-radius: 16px;
    padding: 14px 16px;
    margin: 0 0 14px;
    min-height: 64px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .info .name {
    font-size: clamp(17px, 4.5vw, 20px);
    font-weight: bold;
    color: var(--accent-dark);
  }
  .info .desc {
    font-size: clamp(14px, 3.8vw, 16px);
    line-height: 1.4;
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px 10px;
  }
  .part-status {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 6px;
    border-radius: 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    font-family: inherit;
    cursor: pointer;
    touch-action: manipulation;
  }
  .part-status:active {
    filter: brightness(0.9);
  }
  .btn-label {
    font-size: clamp(18px, 5vw, 22px);
    font-weight: bold;
  }
  .btn-count {
    font-size: clamp(13px, 3.5vw, 15px);
    opacity: 0.9;
  }
  .reset-wrap {
    display: flex;
    justify-content: center;
    margin-top: 22px;
  }
  .reset-btn {
    -webkit-appearance: none;
    appearance: none;
    padding: 8px 20px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--skin-shade);
    border-radius: 999px;
    opacity: 0.6;
    touch-action: manipulation;
  }
  .reset-btn:active {
    opacity: 1;
  }
  @media (max-height: 640px) {
    .character-img { max-height: 225px; }
    .stage { min-height: 225px; padding: 6px 0 12px; }
    h1 { margin: 2px 0 8px; }
    .info { padding: 10px 14px; min-height: 52px; margin-bottom: 10px; }
    .reset-wrap { margin-top: 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>マッチョ育成ゲーム</h1>
  <div class="stage">
    <img class="character-img" id="bodyImage" src="images/lv1.png" alt="キャラクター">
  </div>
  <div class="info" id="info">
    <div class="name">さあ、鍛えよう！</div>
    <div class="desc">キャラクターの体（胸・腕・脚・肩・背中・腹）をタップして筋トレを始めましょう</div>
  </div>
  <div class="controls">
    <button class="part-status" data-part="chest">
      <span class="btn-label">胸</span>
      <span class="btn-count" id="count-chest">0回</span>
    </button>
    <button class="part-status" data-part="arm">
      <span class="btn-label">腕</span>
      <span class="btn-count" id="count-arm">0回</span>
    </button>
    <button class="part-status" data-part="leg">
      <span class="btn-label">脚</span>
      <span class="btn-count" id="count-leg">0回</span>
    </button>
    <button class="part-status" data-part="shoulder">
      <span class="btn-label">肩</span>
      <span class="btn-count" id="count-shoulder">0回</span>
    </button>
    <button class="part-status" data-part="back">
      <span class="btn-label">背中</span>
      <span class="btn-count" id="count-back">0回</span>
    </button>
    <button class="part-status" data-part="abs">
      <span class="btn-label">腹</span>
      <span class="btn-count" id="count-abs">0回</span>
    </button>
  </div>
  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">最初から</button>
  </div>
</div>
<script>
  const parts = {
    chest: { name: '大胸筋', desc: '胸の中心を覆う大きな筋肉。押す動作で使われます。', count: 0 },
    arm: { name: '上腕二頭筋', desc: '腕の力こぶ。ものを持ち上げる動作で使われます。', count: 0 },
    leg: { name: '大腿四頭筋', desc: '太ももの前側の筋肉。歩く・走るときに使われます。', count: 0 },
    shoulder: { name: '三角筋', desc: '肩を丸く覆う筋肉。腕を横に上げる動作で使われます。', count: 0 },
    back: { name: '広背筋', desc: '背中を大きく広げる筋肉。逆三角形の体型を作ります。', count: 0 },
    abs: { name: '腹直筋', desc: 'お腹の中心を縦に走る筋肉。腹筋運動で鍛えられます。', count: 0 }
  };

  const infoName = document.querySelector('#info .name');
  const infoDesc = document.querySelector('#info .desc');
  const bodyImg = document.getElementById('bodyImage');
  const STORAGE_KEY = 'macho-game-progress';
  const STAGE_THRESHOLDS = [0, 10, 25, 45, 70, 100];
  let currentStage = -1;

  function stageForTotal(total) {
    let stage = 0;
    STAGE_THRESHOLDS.forEach((min, idx) => { if (total >= min) stage = idx; });
    return stage;
  }

  function updateBodyStage() {
    const total = Object.keys(parts).reduce((sum, key) => sum + parts[key].count, 0);
    const stageIdx = stageForTotal(total);
    if (stageIdx === currentStage) return;
    currentStage = stageIdx;
    bodyImg.style.opacity = '0';
    setTimeout(() => {
      bodyImg.src = 'images/lv' + (stageIdx + 1) + '.png';
      bodyImg.style.opacity = '1';
    }, 150);
  }

  function saveProgress() {
    const data = {};
    Object.keys(parts).forEach(key => { data[key] = parts[key].count; });
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function loadProgress() {
    let saved;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { saved = null; }
    if (!saved) return;
    Object.keys(parts).forEach(key => {
      if (typeof saved[key] === 'number' && saved[key] > 0) {
        parts[key].count = saved[key];
        document.getElementById('count-' + key).textContent = saved[key] + '回';
      }
    });
    const total = Object.keys(parts).reduce((sum, key) => sum + parts[key].count, 0);
    if (total > 0) {
      infoName.textContent = 'おかえりなさい！';
      infoDesc.textContent = 'ここまで育てたマッチョです。続きを鍛えましょう';
    }
  }

  document.querySelectorAll('.part-status').forEach(zone => {
    zone.addEventListener('click', () => {
      const part = zone.dataset.part;
      const p = parts[part];
      p.count += 1;
      document.getElementById('count-' + part).textContent = p.count + '回';
      infoName.textContent = p.name;
      infoDesc.textContent = p.desc;
      updateBodyStage();
      saveProgress();
    });
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (!window.confirm('本当に最初からやり直しますか？')) return;
    Object.keys(parts).forEach(key => {
      parts[key].count = 0;
      document.getElementById('count-' + key).textContent = '0回';
    });
    infoName.textContent = 'さあ、鍛えよう！';
    infoDesc.textContent = 'キャラクターの体（胸・腕・脚・肩・背中・腹）をタップして筋トレを始めましょう';
    updateBodyStage();
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  });

  loadProgress();
  currentStage = stageForTotal(Object.keys(parts).reduce((sum, key) => sum + parts[key].count, 0));
  bodyImg.src = 'images/lv' + (currentStage + 1) + '.png';
</script>
</body>
</html>
